!version: 15w40b
!base: 1.8

^types:
   entityMetadataItem: $compareTo ?
      if 0: i8
      if 1: varint
      if 2: f32
      if 3: string
      if 4: string
      if 5: slot
      if 6: bool
      if 7:
         pitch: f32
         yaw: f32
         roll: f32
      if 8: position
      if 9: [
         "option",
         "position"
      ]
      if 10: varint
      if 11: [
         "option",
         "UUID"
      ]
      if 12: varint

   entityMetadata: [
      "entityMetadataLoop",
      {
         "endVal": 255,
         "type": [
            "container",
            [
               {
                  "anon": true,
                  "type": [
                     "container",
                     [
                        {
                           "name": "key",
                           "type": "u8"
                        },
                        {
                           "name": "type",
                           "type": "i8"
                        }
                     ]
                  ]
               },
               {
                  "name": "value",
                  "type": [
                     "entityMetadataItem",
                     {
                        "compareTo": "type"
                     }
                  ]
               }
            ]
         ]
      }
   ]

^play.toClient.types:
   packet_map_chunk_bulk: !delete

   packet_update_entity_nbt: !delete

   packet_entity_equipment:
      entityId: varint
      slot: varint
      item: slot

   packet_named_entity_spawn:
      entityId: varint
      playerUUID: UUID
      x: i32
      y: i32
      z: i32
      yaw: i8
      pitch: i8
      metadata: entityMetadata

   packet_spawn_entity:
      entityId: varint
      entityUUID: UUID
      type: i8
      x: i32
      y: i32
      z: i32
      pitch: i8
      yaw: i8
      objectData: i32
      velocity: vec3i16

   packet_spawn_entity_living:
      entityId: varint
      entityUUID: UUID
      type: u8
      x: i32
      y: i32
      z: i32
      yaw: i8
      pitch: i8
      headPitch: i8
      velocity: vec3i16
      metadata: entityMetadata

   packet_map_chunk:
      x: i32
      z: i32
      groundUp: bool
      bitMap: varint
      chunkData: [
         "buffer",
         {
            "countType": "varint"
         }
      ]

   packet_map:
      itemDamage: varint
      scale: i8
      trackingPosition: bool
      icons: []varint
         directionAndType: i8
         x: i8
         z: i8
      columns: i8
      rows: columns ?
         if 0: void
         default: i8
      x: columns ?
         if 0: void
         default: i8
      y: columns ?
         if 0: void
         default: i8
      data: columns ?
         if 0: void
         default: [
            "buffer",
            {
               "countType": "varint"
            }
         ]

   # MC: ClientboundPlayerInfoPacket
   packet_player_info:
      action: varint =>
         - add_player
         - update_game_mode
         - update_latency
         - update_display_name
         - remove_player
      ## https://github.com/extremeheat/extracted_minecraft_data/blob/client1.18.1/client/net/minecraft/network/protocol/game/ClientboundPlayerInfoPacket.java#L122
      data: []varint
         uuid: UUID
         _: ../action ?
            if add_player:
               name: string
               properties: []varint
                  name: string
                  value: string
                  signature?: string
               gamemode: varint
               ping: varint
               displayName?: string
            if update_game_mode:
               gamemode: varint
            if update_latency:
               ping: varint
            if update_display_name:
               displayName?: string
            if remove_player: void

   packet_scoreboard_team:
      team: string
      mode: i8
      name: mode ?
         if 0: string
         if 2: string
         default: void
      prefix: mode ?
         if 0: string
         if 2: string
         default: void
      suffix: mode ?
         if 0: string
         if 2: string
         default: void
      friendlyFire: mode ?
         if 0: i8
         if 2: i8
         default: void
      nameTagVisibility: mode ?
         if 0: string
         if 2: string
         default: void
      collisionRule: mode ?
         if 0: string
         if 2: string
         default: void
      color: mode ?
         if 0: i8
         if 2: i8
         default: void
      players: mode ?
         if 0: string[]varint
         if 3: string[]varint
         if 4: string[]varint
         default: void

   packet_boss_bar:
      entityUUID: UUID
      action: varint
      title: action ?
         if 0: string
         if 3: string
         default: void
      health: action ?
         if 0: f32
         if 2: f32
         default: void
      color: action ?
         if 0: varint
         if 4: varint
         default: void
      dividers: action ?
         if 0: varint
         if 4: varint
         default: void
      flags: action ?
         if 0: u8
         if 5: u8
         default: void

   packet_set_cooldown:
      itemID: varint
      cooldownTicks: varint

   packet_unload_chunk:
      chunkX: i32
      chunkZ: i32

   packet:
      name: varint =>
         0x1f: keep_alive
         0x24: login
         0x0f: chat
         0x43: update_time
         0x3c: entity_equipment
         0x42: spawn_position
         0x3e: update_health
         0x33: respawn
         0x2e: position
         0x37: held_item_slot
         0x2f: bed
         0x06: animation
         0x05: named_entity_spawn
         0x47: collect
         0x00: spawn_entity
         0x03: spawn_entity_living
         0x04: spawn_entity_painting
         0x01: spawn_entity_experience_orb
         0x3b: entity_velocity
         0x30: entity_destroy
         0x29: entity
         0x26: rel_entity_move
         0x28: entity_look
         0x27: entity_move_look
         0x48: entity_teleport
         0x34: entity_head_rotation
         0x1a: entity_status
         0x3a: attach_entity
         0x39: entity_metadata
         0x4a: entity_effect
         0x31: remove_entity_effect
         0x3d: experience
         0x49: update_attributes
         0x20: map_chunk
         0x10: multi_block_change
         0x0b: block_change
         0x0a: block_action
         0x08: block_break_animation
         0x1b: explosion
         0x21: world_event
         0x23: named_sound_effect
         0x22: world_particles
         0x1e: game_state_change
         0x02: spawn_entity_weather
         0x13: open_window
         0x12: close_window
         0x16: set_slot
         0x14: window_items
         0x15: craft_progress_bar
         0x11: transaction
         0x45: update_sign
         0x25: map
         0x09: tile_entity_data
         0x2a: open_sign_entity
         0x07: statistics
         0x2d: player_info
         0x2b: abilities
         0x0e: tab_complete
         0x3f: scoreboard_objective
         0x41: scoreboard_score
         0x38: scoreboard_display_objective
         0x40: scoreboard_team
         0x18: custom_payload
         0x19: kick_disconnect
         0x0d: difficulty
         0x2c: combat_event
         0x36: camera
         0x35: world_border
         0x44: title
         0x1d: set_compression
         0x46: playerlist_header
         0x32: resource_pack_send
         0x0c: boss_bar
         0x17: set_cooldown
         0x1c: unload_chunk
      params: name ?
         if keep_alive: packet_keep_alive
         if login: packet_login
         if chat: packet_chat
         if update_time: packet_update_time
         if entity_equipment: packet_entity_equipment
         if spawn_position: packet_spawn_position
         if update_health: packet_update_health
         if respawn: packet_respawn
         if position: packet_position
         if held_item_slot: packet_held_item_slot
         if bed: packet_bed
         if animation: packet_animation
         if named_entity_spawn: packet_named_entity_spawn
         if collect: packet_collect
         if spawn_entity: packet_spawn_entity
         if spawn_entity_living: packet_spawn_entity_living
         if spawn_entity_painting: packet_spawn_entity_painting
         if spawn_entity_experience_orb: packet_spawn_entity_experience_orb
         if entity_velocity: packet_entity_velocity
         if entity_destroy: packet_entity_destroy
         if entity: packet_entity
         if rel_entity_move: packet_rel_entity_move
         if entity_look: packet_entity_look
         if entity_move_look: packet_entity_move_look
         if entity_teleport: packet_entity_teleport
         if entity_head_rotation: packet_entity_head_rotation
         if entity_status: packet_entity_status
         if attach_entity: packet_attach_entity
         if entity_metadata: packet_entity_metadata
         if entity_effect: packet_entity_effect
         if remove_entity_effect: packet_remove_entity_effect
         if experience: packet_experience
         if update_attributes: packet_update_attributes
         if map_chunk: packet_map_chunk
         if multi_block_change: packet_multi_block_change
         if block_change: packet_block_change
         if block_action: packet_block_action
         if block_break_animation: packet_block_break_animation
         if explosion: packet_explosion
         if world_event: packet_world_event
         if named_sound_effect: packet_named_sound_effect
         if world_particles: packet_world_particles
         if game_state_change: packet_game_state_change
         if spawn_entity_weather: packet_spawn_entity_weather
         if open_window: packet_open_window
         if close_window: packet_close_window
         if set_slot: packet_set_slot
         if window_items: packet_window_items
         if craft_progress_bar: packet_craft_progress_bar
         if transaction: packet_transaction
         if update_sign: packet_update_sign
         if map: packet_map
         if tile_entity_data: packet_tile_entity_data
         if open_sign_entity: packet_open_sign_entity
         if statistics: packet_statistics
         if player_info: packet_player_info
         if abilities: packet_abilities
         if tab_complete: packet_tab_complete
         if scoreboard_objective: packet_scoreboard_objective
         if scoreboard_score: packet_scoreboard_score
         if scoreboard_display_objective: packet_scoreboard_display_objective
         if scoreboard_team: packet_scoreboard_team
         if custom_payload: packet_custom_payload
         if kick_disconnect: packet_kick_disconnect
         if difficulty: packet_difficulty
         if combat_event: packet_combat_event
         if camera: packet_camera
         if world_border: packet_world_border
         if title: packet_title
         if set_compression: packet_set_compression
         if playerlist_header: packet_playerlist_header
         if resource_pack_send: packet_resource_pack_send
         if boss_bar: packet_boss_bar
         if set_cooldown: packet_set_cooldown
         if unload_chunk: packet_unload_chunk

^play.toServer.types:
   packet_use_entity:
      target: varint
      mouse: varint
      x: mouse ?
         if 2: f32
         default: void
      y: mouse ?
         if 2: f32
         default: void
      z: mouse ?
         if 2: f32
         default: void
      hand: mouse ?
         if 0: varint
         if 2: varint
         default: void

   packet_block_place:
      location: position
      direction: varint
      hand: varint
      cursorX: i8
      cursorY: i8
      cursorZ: i8

   packet_arm_animation:
      hand: varint

   packet_settings:
      locale: string
      viewDistance: i8
      chatFlags: varint
      chatColors: bool
      skinParts: u8
      mainHand: varint

   packet_use_item:
      hand: varint

   packet:
      name: varint =>
         0x0a: keep_alive
         0x01: chat
         0x09: use_entity
         0x0e: flying
         0x0b: position
         0x0d: look
         0x0c: position_look
         0x10: block_dig
         0x19: block_place
         0x14: held_item_slot
         0x17: arm_animation
         0x11: entity_action
         0x12: steer_vehicle
         0x07: close_window
         0x06: window_click
         0x04: transaction
         0x15: set_creative_slot
         0x05: enchant_item
         0x16: update_sign
         0x0f: abilities
         0x00: tab_complete
         0x03: settings
         0x02: client_command
         0x08: custom_payload
         0x18: spectate
         0x13: resource_pack_receive
         0x1a: use_item
      params: name ?
         if keep_alive: packet_keep_alive
         if chat: packet_chat
         if use_entity: packet_use_entity
         if flying: packet_flying
         if position: packet_position
         if look: packet_look
         if position_look: packet_position_look
         if block_dig: packet_block_dig
         if block_place: packet_block_place
         if held_item_slot: packet_held_item_slot
         if arm_animation: packet_arm_animation
         if entity_action: packet_entity_action
         if steer_vehicle: packet_steer_vehicle
         if close_window: packet_close_window
         if window_click: packet_window_click
         if transaction: packet_transaction
         if set_creative_slot: packet_set_creative_slot
         if enchant_item: packet_enchant_item
         if update_sign: packet_update_sign
         if abilities: packet_abilities
         if tab_complete: packet_tab_complete
         if settings: packet_settings
         if client_command: packet_client_command
         if custom_payload: packet_custom_payload
         if spectate: packet_spectate
         if resource_pack_receive: packet_resource_pack_receive
         if use_item: packet_use_item
