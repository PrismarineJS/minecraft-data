^play.toServer.types:
   # MC: ServerboundCommandSuggestionPacket
   packet_tab_complete:
      transactionId: varint
      text: string

   # MC: ServerboundContainerButtonClickPacket
   packet_enchant_item:
      windowId: ContainerID
      enchantment: varint

   # MC: ServerboundPlaceRecipePacket
