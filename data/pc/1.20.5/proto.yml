^play.toServer.types:
   packet_settings: !delete

   # MC: ServerboundBlockEntityTagQueryPacket
   packet_query_block_nbt:
      transactionId: varint
      location: position

   # MC: ServerboundChatCommandPacket
   packet_chat_command:
      command: string

   # MC: ServerboundChatCommandSignedPacket
   packet_chat_command_signed:
      command: string
      timestamp: i64
      salt: i64
      argumentSignatures: []varint
         argumentName: string
         signature: [
            "buffer",
            {
               "count": 256
            }
         ]
      messageCount: varint
      acknowledged: [
         "buffer",
         {
            "count": 3
         }
      ]

   # MC: ServerboundChatSessionUpdatePacket
   packet_chat_session_update:
      sessionUUID: UUID
      expireTime: i64
      publicKey: ByteArray
      signature: ByteArray

   ## (Settings is common) ##
   # MC: ServerboundCommandSuggestionPacket
   packet_tab_complete:
      transactionId: varint
      text: string

   # MC: ServerboundContainerClickPacket
   packet_window_click:
      windowId: ContainerID
      stateId: varint
      slot: i16
      mouseButton: i8
      mode: varint
      changedSlots: []varint
         location: i16
         item: Slot
      cursorItem: Slot

   # MC: ServerboundContainerClosePacket
   packet_close_window:
      windowId: ContainerID

   # MC: ServerboundDebugSampleSubscriptionPacket
