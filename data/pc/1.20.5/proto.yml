!version: 1.20.5
!base: 1.20.3

^types:
   slot: !delete

   particleData: !delete

   entityMetadataItem: !delete

   IDSet: ["registryEntryHolderSet", {
      "base": { name: "name", type: "string" },
      "otherwise": { name: "ids", type: "varint" }
   }]

   ContainerID: u8

   SlotComponentType: varint =>
      - custom_data
      - max_stack_size
      - max_damage
      - damage
      - unbreakable
      - custom_name
      - item_name
      - lore
      - rarity
      - enchantments
      - can_place_on
      - can_break
      - attribute_modifiers
      - custom_model_data
      - hide_additional_tooltip
      - hide_tooltip
      - repair_cost
      - creative_slot_lock
      - enchantment_glint_override
      - intangible_projectile
      - food
      - fire_resistant
      - tool
      - stored_enchantments
      - dyed_color
      - map_color
      - map_id
      - map_decorations
      - map_post_processing
      - charged_projectiles
      - bundle_contents
      - potion_contents
      - suspicious_stew_effects
      - writable_book_content
      - written_book_content
      - trim
      - debug_stick_state
      - entity_data
      - bucket_entity_data
      - block_entity_data
      - instrument
      - ominous_bottle_amplifier
      - recipes
      - lodestone_tracker
      - firework_explosion
      - fireworks
      - profile
      - note_block_sound
      - banner_patterns
      - base_color
      - pot_decorations
      - container
      - block_state
      - bees
      - lock
      - container_loot

   SlotComponent:
      type: SlotComponentType
      ## Ref: client/net/minecraft/core/component/DataComponents.java
      data: type ?
         ## TODO: look into how nbt works here
         if custom_data: anonymousNbt
         if max_stack_size: varint
         if max_damage: varint
         if damage: varint
         if unbreakable: bool
         if custom_name: anonymousNbt
         if item_name: anonymousNbt
         if lore: anonOptionalNbt[]varint
         if rarity: varint =>
         - common
         - uncommon
         - rare
         - epic
         if enchantments:
            enchantments: []varint
               id: varint
               level: varint
            showTooltip: bool
         if can_place_on or can_break:
            predicates: ItemBlockPredicate[]varint
            showTooltip: bool
         if attribute_modifiers:
            attributes: []varint
               typeId: varint
               uuid: UUID
               name: string
               value: f64
               operation: varint =>
               - add
               - multiply_base
               - multiply_total
               slot: varint =>
               - any
               - main_hand
               - off_hand
               - hand
               - feet
               - legs
               - chest
               - head
               - armor
               - body
            showTooltip: bool
         if custom_model_data: varint
         if hide_additional_tooltip: void
         if hide_tooltip: void
         if repair_cost: varint
         if creative_slot_lock: void
         if enchantment_glint_override: bool
         if intangible_projectile: anonymousNbt
         if food:
            nutrition: varint
            # How much saturation will be given after consuming the item.
            saturationModifier: f32
            # Whether the item can always be eaten, even at full hunger.
            canAlwaysEat: bool
            secondsToEat: f32
            usingConvertsTo: Slot
            effects: []varint
               effect: varint
               probability: f32
         if fire_resistant: void
         if tool:
            rules: []varint
               blocks: IDSet
               # The speed at which the tool breaks this rules' blocks.
               speed?: f32
               # Whether items should drop only if this is the correct tool.
               correctDropForBlocks?: bool
            # The mining speed in case none of the previous rule were matched.
            defaultMiningSpeed: f32
            damagePerBlock: varint
         if stored_enchantments:
            enchantments: []varint
               # The ID of the enchantment in the enchantment registry.
               id: varint
               level: varint
            # Whether the list of enchantments should be shown on the item's tooltip.
            showInTooltip: bool
         if dyed_color:
            color: i32
            showTooltip: bool
         if map_color: i32
         if map_id: varint
         if map_decorations: anonymousNbt
         if map_post_processing: varint
         if charged_projectiles:
            projectiles: Slot[]varint
         if bundle_contents:
            contents: Slot[]varint
         if potion_contents:
            # True if this potion has an ID in the potion registry--it has the default effects associated with the potion type.
            potionId?: varint
            # The RGB components of the color, encoded as an integer.
            customColor?: i32
            customEffects: ItemPotionEffect[]varint
            customName?: string
         if suspicious_stew_effects:
            effects: []varint
               # The ID of the effect in the potion effect type registry.
               effect: varint
               # The duration of the effect.
               duration: varint
         if writable_book_content:
            # Max 100 pages
            pages: ItemBookPage[]varint
         if written_book_content:
            rawTitle: string
            filteredTitle?: string
            author: string
            generation: varint
            pages: ItemWrittenBookPage[]varint
            resolved: bool
         if trim:
            material: ["registryEntryHolder", { "baseName": "materialId", "otherwise": { "name": "data", "type": "ArmorTrimMaterial" } }]
            pattern: ["registryEntryHolder", { "baseName": "patternId", "otherwise": { "name": "data", "type": "ArmorTrimPattern" } }]
            showInTooltip: bool
         if debug_stick_state: anonymousNbt
         if entity_data: anonymousNbt
         if bucket_entity_data: anonymousNbt
         if block_entity_data: anonymousNbt
         if instrument: ["registryEntryHolder", { "baseName": "instrumentId", "otherwise": { "name": "data", "type": "InstrumentData" } }]
         if ominous_bottle_amplifier: varint
         if recipes: anonymousNbt
         if lodestone_tracker:
            # Specified if this lodestone points to a position; otherwise it spins randomly.
            globalPosition?:
               dimension: string
               # The position the compass points to. Only present if Has Global Position is true.
               position: position
            # Whether the component is removed when the associated lodestone is broken.
            tracked: bool
         if firework_explosion: ItemFireworkExplosion
         if fireworks:
            flightDuration: varint
            explosions: ItemFireworkExplosion[]varint
         if profile:
            # If the profile has a name, max 16 characters.
            name?: string
            uuid?: UUID
            properties: []varint
               # Max 64 characters
               name: string
               value: string
               # Max 1024 characters
               signature?: string
         if note_block_sound: string
         if banner_patterns:
            layers: BannerPatternLayer[]varint
         if base_color: varint
         if pot_decorations:
            # The ID of the items in the item registry.
            decorations: varint[]varint
         if container:
            contents: Slot[]varint
         if block_state:
            properties: []varint
               name: string
               value: string
         if bees:
            bees: []varint
               # Custom data for the entity, always a Compound Tag. Same structure as the minecraft:custom_data component.
               nbtData: anonymousNbt
               ticksInHive: varint
               minTicksInHive: varint
         if lock: anonymousNbt
         if container_loot: anonymousNbt

   ItemFireworkExplosion:
      shape: varint =>
         - small_ball
         - large_ball
         - star
         - creeper
         - burst
      # The RGB components of the color, encoded as an integer.
      colors: i32[]varint
      # The RGB components of the color, encoded as an integer.
      fadeColors: i32[]varint
      # Whether the firework has a trail.
      hasTrail: bool
      # Whether the firework has a twinkle effect.
      hasTwinkle: bool

   ItemEffectDetail:
      amplifier: varint
      duration: varint
      ambient: bool
      showParticles: bool
      showIcon: bool
      hiddenEffect?: ItemEffectDetail

   ItemPotionEffect:
      id: varint
      details: ItemEffectDetail

   ItemBlockProperty:
      name: string
      isExactMatch: bool
      value: isExactMatch ?
         if true:
            exactValue: string
         if false:
            minValue: string
            maxValue: string

   ItemBlockPredicate:
      blockSet?: ["registryEntryHolderSet", {
         "base": { name: "name", type: "string" },
         "otherwise": { name: "blockIds", type: "varint" }
      }]
      properties?: ItemBlockProperty[]varint
      nbt: anonOptionalNbt

   ItemBookPage:
      # The raw text of the page. TextComponent, max 1024 characters.
      content: string
      filteredContent?: string

   ItemWrittenBookPage:
      content: anonymousNbt
      filteredContent: anonOptionalNbt

   ArmorTrimMaterial:
      assetName: string
      ingredientId: varint
      overrideArmorAssets: []varint
         key: string
         value: string
      description: anonymousNbt

   ArmorTrimPattern:
      assetId: string
      templateItemId: varint
      description: anonymousNbt
      decal: bool

   InstrumentData:
      soundEvent: ItemSoundHolder
      useDuration: f32
      range: f32
      description: anonymousNbt

   BannerPattern:
      assetId: string
      translationKey: string

   BannerPatternLayer:
      pattern: ["registryEntryHolder", { "baseName": "patternId", "otherwise": { "name": "data", "type": "BannerPattern" } }]
      colorId: varint

   Slot:
      itemCount: i8
      _: itemCount ?
         if 0: void
         default:
            itemId: varint
            # https://wiki.vg/Slot_Data#Structured_components
            addedComponentCount: varint
            removedComponentCount: varint
            components: SlotComponent[]$addedComponentCount
            removeComponents: []$removedComponentCount
               type: SlotComponentType

   Particle:
      # See client/net/minecraft/core/particles/ParticleTypes.java
      type: varint =>
         - angry_villager
         - block
         - block_marker
         - bubble
         - cloud
         - crit
         - damage_indicator
         - dragon_breath
         - dripping_lava
         - falling_lava
         - landing_lava
         - dripping_water
         - falling_water
         - dust
         - dust_color_transition
         - effect
         - elder_guardian
         - enchanted_hit
         - enchant
         - end_rod
         - entity_effect
         - explosion_emitter
         - explosion
         - gust
         - small_gust
         - gust_emitter_large
         - gust_emitter_small
         - sonic_boom
         - falling_dust
         - firework
         - fishing
         - flame
         - infested
         - cherry_leaves
         - sculk_soul
         - sculk_charge
         - sculk_charge_pop
         - soul_fire_flame
         - soul
         - flash
         - happy_villager
         - composter
         - heart
         - instant_effect
         - item
         - vibration
         - item_slime
         - item_cobweb
         - item_snowball
         - large_smoke
         - lava
         - mycelium
         - note
         - poof
         - portal
         - rain
         - smoke
         - white_smoke
         - sneeze
         - spit
         - squid_ink
         - sweep_attack
         - totem_of_undying
         - underwater
         - splash
         - witch
         - bubble_pop
         - current_down
         - bubble_column_up
         - nautilus
         - dolphin
         - campfire_cosy_smoke
         - campfire_signal_smoke
         - dripping_honey
         - falling_honey
         - landing_honey
         - falling_nectar
         - falling_spore_blossom
         - ash
         - crimson_spore
         - warped_spore
         - spore_blossom_air
         - dripping_obsidian_tear
         - falling_obsidian_tear
         - landing_obsidian_tear
         - reverse_portal
         - white_ash
         - small_flame
         - snowflake
         - dripping_dripstone_lava
         - falling_dripstone_lava
         - dripping_dripstone_water
         - falling_dripstone_water
         - glow_squid_ink
         - glow
         - wax_on
         - wax_off
         - electric_spark
         - scrape
         - shriek
         - egg_crack
         - dust_plume
         - trial_spawner_detected_player
         - trial_spawner_detected_player_ominous
         - vault_connection
         - dust_pillar
         - ominous_spawning
         - raid_omen
         - trial_omen
      ## ## Tips for reviewing particle data (as of 1.20.5)
      ## Inside the registry code, each particle can have an associated "options" type and
      ## each options type can add additional data to be encoded.
      ## For example, this line
      ##    public static final ParticleType<BlockParticleOption> BLOCK = register("block", false, BlockParticleOption::codec, BlockParticleOption::streamCodec);
      ## will read the stream codec from BlockParticleOption.java's streamCodec member; then we see
      ##       return ByteBufCodecs.idMapper(Block.BLOCK_STATE_REGISTRY).map(var1 -> new BlockParticleOption(var0, var1), var0x -> var0x.state);
      ## this encodes with the ByteBufCodecs.idMapper function. Inside this function we find
      ##      public void encode(ByteBuf var1x, T var2) {
      ##          int var3 = var1.applyAsInt(var2);
      ##          VarInt.write(var1x, var3);
      ##       }
      ## which as we can see writes the varint to the buffer.
      ## If you want to see all the serializers try regexp searching "StreamCodec.*Particle"
      data: type ?
         if block or block_marker or falling_dust or dust_pillar: varint
         if dust:
            red: f32
            green: f32
            blue: f32
            scale: f32
         if dust_color_transition:
            fromRed: f32
            fromGreen: f32
            fromBlue: f32
            scale: f32
            toRed: f32
            toGreen: f32
            toBlue: f32
         if entity_effect: i32
         if item: Slot
         if sculk_charge: f32
         if shriek: varint
         if vibration:
            positionType: varint =>
            - block
            - entity
            position: positionType ?
               if block: position
               if entity:
                  entityId: varint
                  entityEyeHeight: f32
            ticks: varint

   ingredient: Slot[]varint

   entityMetadataEntry:
      key: u8
      type: varint =>
      - byte
      - int
      - long
      - float
      - string
      - component
      - optional_component
      - item_stack
      - boolean
      - rotations
      - block_pos
      - optional_block_pos
      - direction
      - optional_uuid
      - block_state
      - optional_block_state
      - compound_tag
      - particle
      - particles
      - villager_data
      - optional_unsigned_int
      - pose
      - cat_variant
      - wolf_variant
      - frog_variant
      - optional_global_pos
      - painting_variant
      - sniffer_state
      - armadillo_state
      - vector3
      - quaternion
      value: type ?
         if byte: i8
         if int: varint
         if long: varlong
         if float: f32
         if string: string
         if component: anonymousNbt
         if optional_component: ["option", "anonymousNbt"]
         if item_stack: Slot
         if boolean: bool
         if rotations:
            pitch: f32
            yaw: f32
            roll: f32
         if block_pos: position
         if optional_block_pos: ["option", "position"]
         if direction: varint
         if optional_uuid: ["option", "UUID"]
         if block_state: varint
         if optional_block_state: optvarint
         if compound_tag: anonymousNbt
         if particle: Particle
         if particles: Particle[]varint
         if villager_data:
            villagerType: varint
            villagerProfession: varint
            level: varint
         if optional_unsigned_int: optvarint
         if pose: varint
         if cat_variant: varint
         if wolf_variant: ["registryEntryHolder", {
            "baseName": "variantId",
            "otherwise": { name: "variantData", type: "EntityMetadataWolfVariant" }
         }]
         if frog_variant: varint
         if optional_global_pos: ["option", "string"]
         if painting_variant: ["registryEntryHolder", {
            "baseName": "variantId",
            "otherwise": { name: "variantData", type: "EntityMetadataPaintingVariant" }
         }]
         if sniffer_state: varint
         if armadillo_state: varint
         if vector3: vec3f
         if quaternion: vec4f

   EntityMetadataPaintingVariant:
      width: i32
      height: i32
      assetId: string
      title?: anonymousNbt
      author?: anonymousNbt

   EntityMetadataWolfVariant:
      wildTexture: string
      tameTexture: string
      angryTexture: string
      biome: IDSet

   entityMetadata: ["entityMetadataLoop", { "endVal": 255, "type": "entityMetadataEntry" }]

   minecraft_smelting_format:
      group: string
      category: varint
      ingredient: ingredient
      result: Slot
      experience: f32
      cookTime: varint

   command_node:
      flags: [
         "bitfield",
         [
            {
               "name": "unused",
               "size": 3,
               "signed": false
            },
            {
               "name": "has_custom_suggestions",
               "size": 1,
               "signed": false
            },
            {
               "name": "has_redirect_node",
               "size": 1,
               "signed": false
            },
            {
               "name": "has_command",
               "size": 1,
               "signed": false
            },
            {
               "name": "command_node_type",
               "size": 2,
               "signed": false
            }
         ]
      ]
      children: varint[]varint
      redirectNode: flags/has_redirect_node ?
         if 1: varint
         default: void
      extraNodeData: flags/command_node_type ?
         if 0: void
         if 1:
            name: string
         if 2:
            name: string
            parser: varint =>
            - brigadier:bool
            - brigadier:float
            - brigadier:double
            - brigadier:integer
            - brigadier:long
            - brigadier:string
            - minecraft:entity
            - minecraft:game_profile
            - minecraft:block_pos
            - minecraft:column_pos
            - minecraft:vec3
            - minecraft:vec2
            - minecraft:block_state
            - minecraft:block_predicate
            - minecraft:item_stack
            - minecraft:item_predicate
            - minecraft:color
            - minecraft:component
            - minecraft:style
            - minecraft:message
            - minecraft:nbt
            - minecraft:nbt_tag
            - minecraft:nbt_path
            - minecraft:objective
            - minecraft:objective_criteria
            - minecraft:operation
            - minecraft:particle
            - minecraft:angle
            - minecraft:rotation
            - minecraft:scoreboard_slot
            - minecraft:score_holder
            - minecraft:swizzle
            - minecraft:team
            - minecraft:item_slot
            - minecraft:item_slots # 1.20.5
            - minecraft:resource_location
            - minecraft:function
            - minecraft:entity_anchor
            - minecraft:int_range
            - minecraft:float_range
            - minecraft:dimension
            - minecraft:gamemode
            - minecraft:time
            - minecraft:resource_or_tag
            - minecraft:resource_or_tag_key
            - minecraft:resource
            - minecraft:resource_key
            - minecraft:template_mirror
            - minecraft:template_rotation
            - minecraft:heightmap
            - minecraft:loot_table # 1.20.5
            - minecraft:loot_predicate # 1.20.5
            - minecraft:loot_modifier # 1.20.5
            - minecraft:uuid
            properties: parser ?
               if brigadier:bool: void
               if brigadier:float:
                  flags: [
                     "bitfield",
                     [
                        {
                           "name": "unused",
                           "size": 6,
                           "signed": false
                        },
                        {
                           "name": "max_present",
                           "size": 1,
                           "signed": false
                        },
                        {
                           "name": "min_present",
                           "size": 1,
                           "signed": false
                        }
                     ]
                  ]
                  min: flags/min_present ?
                     if 1: f32
                     default: void
                  max: flags/max_present ?
                     if 1: f32
                     default: void
               if brigadier:double:
                  flags: [
                     "bitfield",
                     [
                        {
                           "name": "unused",
                           "size": 6,
                           "signed": false
                        },
                        {
                           "name": "max_present",
                           "size": 1,
                           "signed": false
                        },
                        {
                           "name": "min_present",
                           "size": 1,
                           "signed": false
                        }
                     ]
                  ]
                  min: flags/min_present ?
                     if 1: f64
                     default: void
                  max: flags/max_present ?
                     if 1: f64
                     default: void
               if brigadier:integer:
                  flags: [
                     "bitfield",
                     [
                        {
                           "name": "unused",
                           "size": 6,
                           "signed": false
                        },
                        {
                           "name": "max_present",
                           "size": 1,
                           "signed": false
                        },
                        {
                           "name": "min_present",
                           "size": 1,
                           "signed": false
                        }
                     ]
                  ]
                  min: flags/min_present ?
                     if 1: i32
                     default: void
                  max: flags/max_present ?
                     if 1: i32
                     default: void
               if brigadier:long:
                  flags: [
                     "bitfield",
                     [
                        {
                           "name": "unused",
                           "size": 6,
                           "signed": false
                        },
                        {
                           "name": "max_present",
                           "size": 1,
                           "signed": false
                        },
                        {
                           "name": "min_present",
                           "size": 1,
                           "signed": false
                        }
                     ]
                  ]
                  min: flags/min_present ?
                     if 1: i64
                     default: void
                  max: flags/max_present ?
                     if 1: i64
                     default: void
               if brigadier:string: varint =>
                  0: SINGLE_WORD
                  1: QUOTABLE_PHRASE
                  2: GREEDY_PHRASE
               if minecraft:entity: [
                  "bitfield",
                  [
                     {
                        "name": "unused",
                        "size": 6,
                        "signed": false
                     },
                     {
                        "name": "onlyAllowPlayers",
                        "size": 1,
                        "signed": false
                     },
                     {
                        "name": "onlyAllowEntities",
                        "size": 1,
                        "signed": false
                     }
                  ]
               ]
               if minecraft:game_profile: void
               if minecraft:block_pos: void
               if minecraft:column_pos: void
               if minecraft:vec3: void
               if minecraft:vec2: void
               if minecraft:block_state: void
               if minecraft:block_predicate: void
               if minecraft:item_stack: void
               if minecraft:item_predicate: void
               if minecraft:color: void
               if minecraft:component: void
               if minecraft:message: void
               if minecraft:nbt: void
               if minecraft:nbt_path: void
               if minecraft:objective: void
               if minecraft:objective_criteria: void
               if minecraft:operation: void
               if minecraft:particle: void
               if minecraft:angle: void
               if minecraft:rotation: void
               if minecraft:scoreboard_slot: void
               if minecraft:score_holder: [
                  "bitfield",
                  [
                     {
                        "name": "unused",
                        "size": 7,
                        "signed": false
                     },
                     {
                        "name": "allowMultiple",
                        "size": 1,
                        "signed": false
                     }
                  ]
               ]
               if minecraft:swizzle: void
               if minecraft:team: void
               if minecraft:item_slot: void
               if minecraft:resource_location: void
               if minecraft:function: void
               if minecraft:entity_anchor: void
               if minecraft:int_range: void
               if minecraft:float_range: void
               if minecraft:dimension: void
               if minecraft:gamemode: void
               if minecraft:time:
                  min: i32
               if minecraft:resource_or_tag:
                  registry: string
               if minecraft:resource_or_tag_key:
                  registry: string
               if minecraft:resource:
                  registry: string
               if minecraft:resource_key:
                  registry: string
               if minecraft:template_mirror: void
               if minecraft:template_rotation: void
               if minecraft:heightmap: void
               if minecraft:uuid: void
            suggestionType: ../flags/has_custom_suggestions ?
               if 1: string
               default: void

   # # Shared Packets
   # These are packets that are shared between multiple states.
   # They are defined here to avoid duplication.
   # =====
   # MC: ServerboundClientInformationPacket
   packet_common_settings:
      locale: string
      viewDistance: i8
      chatFlags: varint
      chatColors: bool
      skinParts: u8
      mainHand: varint
      enableTextFiltering: bool
      enableServerListing: bool

   # MC: ClientboundCookieRequestPacket
   packet_common_cookie_request:
      cookie: string

   # MC: ClientboundStoreCookiePacket
   packet_common_store_cookie:
      key: string
      value: ByteArray

   # MC: ClientboundTransferPacket
   packet_common_transfer:
      host: string
      port: varint

   # MC: ServerboundCookieResponsePacket
   packet_common_cookie_response:
      key: string
      value?: ByteArray

   # MC: ServerboundSelectKnownPacks
   # MC: ClientboundSelectKnownPacks
   packet_common_select_known_packs:
      packs: []varint
         namespace: string
         id: string
         version: string

   # MC: ClientboundResourcePackPopPacket
   packet_common_remove_resource_pack:
      uuid?: UUID

   # MC: ClientboundResourcePackPushPacket
   packet_common_add_resource_pack:
      uuid: UUID
      url: string
      hash: string
      forced: bool
      promptMessage?: anonymousNbt

^login.toClient.types:
   # MC: ClientboundHelloPacket
   packet_encryption_begin:
      serverId: string
      publicKey: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      verifyToken: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      shouldAuthenticate: bool

   # MC: ClientboundGameProfilePacket
   packet_success:
      uuid: UUID
      username: string
      properties: []varint
         name: string
         value: string
         signature?: string
      strictErrorHandling: bool

   ## (Cookie Request is Common) ##
   packet:
      name: varint =>
      - disconnect
      - encryption_begin
      - success
      - compress
      - login_plugin_request
      - cookie_request
      params: name ?
         if disconnect: packet_disconnect
         if encryption_begin: packet_encryption_begin
         if success: packet_success
         if compress: packet_compress
         if login_plugin_request: packet_login_plugin_request
         if cookie_request: packet_common_cookie_request

^login.toServer.types:
   ## (Cookie Response is Common) ##
   packet:
      name: varint =>
      - login_start
      - encryption_begin
      - login_plugin_response
      - login_acknowledged
      - cookie_response
      params: name ?
         if login_start: packet_login_start
         if encryption_begin: packet_encryption_begin
         if login_plugin_response: packet_login_plugin_response
         if login_acknowledged: packet_login_acknowledged
         if cookie_response: packet_common_cookie_response

^configuration.toClient.types:
   packet_remove_resource_pack: !delete

   packet_add_resource_pack: !delete

   ## (Cookie Request is common)
   # MC: ClientboundCustomPayloadPacket
   packet_custom_payload:
      channel: string
      data: restBuffer

   # MC: ClientboundResetChatPacket
   packet_reset_chat:
      # Empty

   # MC: ClientboundRegistryDataPacket
   packet_registry_data:
      # The server can send multiple registries
      id: string
      entries: []varint
         key: string
         value?: anonymousNbt

   ## (Store cookie and Transfer are Common) ##
   # MC: ClientboundUpdateEnabledFeaturesPacket
   packet_feature_flags:
      features: string[]varint

   ## (Select known packs is common)
   packet:
      name: varint =>
      - cookie_request
      - custom_payload
      - disconnect
      - finish_configuration
      - keep_alive
      - ping
      - reset_chat
      - registry_data
      - remove_resource_pack
      - add_resource_pack
      - store_cookie
      - transfer
      - feature_flags
      - tags
      - select_known_packs
      params: name ?
         if cookie_request: packet_common_cookie_request
         if custom_payload: packet_custom_payload
         if disconnect: packet_disconnect
         if finish_configuration: packet_finish_configuration
         if keep_alive: packet_keep_alive
         if ping: packet_ping
         if reset_chat: packet_reset_chat
         if registry_data: packet_registry_data
         if remove_resource_pack: packet_common_remove_resource_pack
         if add_resource_pack: packet_common_add_resource_pack
         if store_cookie: packet_common_store_cookie
         if transfer: packet_common_transfer
         if feature_flags: packet_feature_flags
         if tags: packet_tags
         if select_known_packs: packet_common_select_known_packs

^configuration.toServer.types:
   packet_settings: !delete

   ## (Settings is Common) ##
   ## (Cookie Response is Common) ##
   # MC: ServerboundCustomPayloadPacket
   packet_custom_payload:
      channel: string
      data: restBuffer

   packet:
      name: varint =>
      - settings
      - cookie_response
      - custom_payload
      - finish_configuration
      - keep_alive
      - pong
      - resource_pack_receive
      - select_known_packs
      params: name ?
         if settings: packet_common_settings
         if cookie_response: packet_common_cookie_response
         if custom_payload: packet_custom_payload
         if finish_configuration: packet_finish_configuration
         if keep_alive: packet_keep_alive
         if pong: packet_pong
         if resource_pack_receive: packet_resource_pack_receive
         if select_known_packs: packet_common_select_known_packs

^play.toClient.types:
   packet_remove_resource_pack: !delete

   packet_add_resource_pack: !delete

   # World state information for spawn and respawn packets
   SpawnInfo:
      dimension: varint
      name: string
      hashedSeed: i64
      gamemode: i8 =>
      - survival
      - creative
      - adventure
      - spectator
      previousGamemode: u8
      isDebug: bool
      isFlat: bool
      death?:
         dimensionName: string
         location: position
      portalCooldown: varint

   # MC: ClientboundChunksBiomesPacket
   packet_chunk_biomes:
      biomes: []varint
         position: packedChunkPos
         data: ByteArray

   # MC: ClientboundContainerClosePacket
   packet_close_window:
      windowId: ContainerID

   # MC: ClientboundContainerSetContentPacket
   packet_window_items:
      windowId: ContainerID
      stateId: varint
      items: Slot[]varint
      carriedItem: Slot

   # MC: ClientboundContainerSetDataPacket
   packet_craft_progress_bar:
      windowId: ContainerID
      property: i16
      value: i16

   # MC: ClientboundContainerSetSlotPacket
   packet_set_slot:
      windowId: ContainerID
      stateId: varint
      slot: i16
      item: Slot

   ## (Cookie Request is Common)
   # MC: ClientboundCooldownPacket
   packet_set_cooldown:
      itemID: varint
      cooldownTicks: varint

   # MC: ClientboundDebugSamplePacket
   packet_debug_sample:
      sample: i64[]varint
      type: varint

   ## client\net\minecraft\network\chat\ChatTypeDecoration.java
   ## via client\net\minecraft\network\chat\ChatType.java
   ChatTypeParameterType: varint =>
      - content
      - sender
      - target

   ChatType:
      translationKey: string
      parameters: ChatTypeParameterType[]varint
      style: anonymousNbt

   ChatTypes:
      chat: ChatType
      narration: ChatType

   # MC: ClientboundHorseScreenOpenPacket
   packet_open_horse_window:
      windowId: ContainerID
      nbSlots: varint
      entityId: i32

   # MC: ClientboundLevelParticlesPacket
   packet_world_particles:
      longDistance: bool
      x: f64
      y: f64
      z: f64
      offsetX: f32
      offsetY: f32
      offsetZ: f32
      velocityOffset: f32
      amount: i32
      particle: Particle

   # MC: ClientboundLoginPacket
   packet_login:
      entityId: i32
      isHardcore: bool
      worldNames: string[]varint
      maxPlayers: varint
      viewDistance: varint
      simulationDistance: varint
      reducedDebugInfo: bool
      enableRespawnScreen: bool
      doLimitedCrafting: bool
      worldState: SpawnInfo
      enforcesSecureChat: bool

   # MC: ClientboundMerchantOffersPacket
   packet_trade_list:
      windowId: ContainerID
      ## https://github.com/extremeheat/extracted_minecraft_data/blob/client1.20.5/client/net/minecraft/world/item/trading/MerchantOffer.java#L210
      trades: []varint
         inputItem1:
            itemId: varint
            itemCount: varint
            addedComponentCount: varint
            components: SlotComponent[]$addedComponentCount
         outputItem: Slot
         inputItem2?:
            itemId: varint
            itemCount: varint
            addedComponentCount: varint
            components: SlotComponent[]$addedComponentCount
         tradeDisabled: bool
         nbTradeUses: i32
         maximumNbTradeUses: i32
         xp: i32
         specialPrice: i32
         priceMultiplier: f32
         demand: i32
      villagerLevel: varint
      experience: varint
      isRegularVillager: bool
      canRestock: bool

   # MC: ClientboundPlaceGhostRecipePacket
   packet_craft_recipe_response:
      windowId: ContainerID
      recipe: string

   # Relative.java
   PositionUpdateRelatives: ["bitflags", {
      "type": "u8",
      "flags": ["x", "y", "z", "yaw", "pitch"]
   }]

   # MC: ClientboundPlayerPositionPacket
   packet_position:
      x: f64
      y: f64
      z: f64
      yaw: f32
      pitch: f32
      flags: PositionUpdateRelatives
      teleportId: varint

   # MC: ClientboundRespawnPacket
   packet_respawn:
      worldState: SpawnInfo
      # Bit field: 0b1 - KEEP_ATTRIBUTE_MODIFIERS, 0b10 - KEEP_ENTITY_DATA
      copyMetadata: u8

   # MC: ClientboundSectionBlocksUpdatePacket
   packet_multi_block_change:
      chunkCoordinates: [ "bitfield", [
         { "name": "x", "size": 22, "signed": true },
         { "name": "z", "size": 22, "signed": true },
         { "name": "y", "size": 20, "signed": true }
      ]]
      records: varint[]varint

   # MC: ClientboundServerDataPacket
   packet_server_data:
      motd: anonymousNbt
      iconBytes?: ByteArray

   # MC: ClientboundSetEquipmentPacket
   packet_entity_equipment:
      entityId: varint
      equipments: [
         "topBitSetTerminatedArray",
         {
            "type": [
               "container",
               [
                  {
                     "name": "slot",
                     "type": "i8"
                  },
                  {
                     "name": "item",
                     "type": "Slot"
                  }
               ]
            ]
         }
      ]

   # MC: ClientboundSoundEntityPacket
   packet_entity_sound_effect:
      sound: ItemSoundHolder
      soundCategory: soundSource
      entityId: varint
      volume: f32
      pitch: f32
      seed: i64

   ## (Store Cookie is Common)
   # MC: ClientboundSystemChatPacket
   packet_system_chat:
      content: anonymousNbt
      isActionBar: bool

   ## (Transfer is common)
   # MC: ClientboundUpdateAdvancementsPacket
   packet_advancements:
      reset: bool
      advancementMapping: []varint
         key: string
         value:
            parentId?: string
            displayData?:
               title: anonymousNbt
               description: anonymousNbt
               icon: Slot
               frameType: varint
               flags: ["bitfield", [
                  { "name": "unused", "size": 29, "signed": false },
                  { "name": "hidden", "size": 1, "signed": false },
                  { "name": "show_toast", "size": 1, "signed": false },
                  { "name": "has_background_texture", "size": 1, "signed": false }
               ]]
               backgroundTexture: flags/has_background_texture ?
                  if 1: string
                  default: void
               xCord: f32
               yCord: f32
            requirements: []varint
               _: string[]varint
            sendsTelemtryData: bool
      identifiers: string[]varint
      progressMapping: []varint
         key: string
         value: []varint
            criterionIdentifier: string
            criterionProgress?: i64

   # MC: ClientboundUpdateAttributesPacket
   packet_entity_update_attributes:
      entityId: varint
      properties: []varint
         key: varint =>
         - generic.armor
         - generic.armor_toughness
         - generic.attack_damage
         - generic.attack_knockback
         - generic.attack_speed
         - player.block_break_speed
         - player.block_interaction_range
         - player.entity_interaction_range
         - generic.fall_damage_multiplier
         - generic.flying_speed
         - generic.follow_range
         - generic.gravity
         - generic.jump_strength
         - generic.knockback_resistance
         - generic.luck
         - generic.max_absorption
         - generic.max_health
         - generic.movement_speed
         - generic.safe_fall_distance
         - generic.scale
         - zombie.spawn_reinforcements
         - generic.step_height
         value: f64
         modifiers: []varint
            uuid: UUID
            amount: f64
            operation: i8

   # MC: ClientboundUpdateMobEffectPacket
   packet_entity_effect:
      entityId: varint
      effectId: varint
      amplifier: varint
      duration: varint
      # a bitfield of 0x01 for ambient, 0x02 for show particles
      # flags: ["bitfield", [
      #    { "name": "unused", "size": 4 },
      #    { "name": "ambient", "size": 1 },
      #    { "name": "showParticles", "size": 1 },
      #    { "name": "showIcon", "size": 1 },
      #    { "name": "blend", "size": 1 }
      # ]]
      flags: u8

   # MC: ClientboundUpdateRecipesPacket
   packet_declare_recipes:
      recipes: []varint
         name: string
         type: varint =>
         - minecraft:crafting_shaped
         - minecraft:crafting_shapeless
         - minecraft:crafting_special_armordye
         - minecraft:crafting_special_bookcloning
         - minecraft:crafting_special_mapcloning
         - minecraft:crafting_special_mapextending
         - minecraft:crafting_special_firework_rocket
         - minecraft:crafting_special_firework_star
         - minecraft:crafting_special_firework_star_fade
         - minecraft:crafting_special_tippedarrow
         - minecraft:crafting_special_bannerduplicate
         - minecraft:crafting_special_shielddecoration
         - minecraft:crafting_special_shulkerboxcoloring
         - minecraft:crafting_special_suspiciousstew
         - minecraft:crafting_special_repairitem
         - minecraft:smelting
         - minecraft:blasting
         - minecraft:smoking
         - minecraft:campfire_cooking
         - minecraft:stonecutting
         - minecraft:smithing_transform
         - minecraft:smithing_trim
         - minecraft:crafting_decorated_pot
         data: type ?
            if minecraft:crafting_shapeless:
               group: string
               category: varint
               ingredients: ingredient[]varint
               result: Slot
            if minecraft:crafting_shaped:
               group: string
               category: varint
               gridWidth: varint
               gridHeight: varint
               ingredients: []$gridWidth
                  _: ingredient[]$gridHeight
               result: Slot
               showNotification: bool
            if minecraft:crafting_special_armordye: minecraft_simple_recipe_format
            if minecraft:crafting_special_bookcloning: minecraft_simple_recipe_format
            if minecraft:crafting_special_mapcloning: minecraft_simple_recipe_format
            if minecraft:crafting_special_mapextending: minecraft_simple_recipe_format
            if minecraft:crafting_special_firework_rocket: minecraft_simple_recipe_format
            if minecraft:crafting_special_firework_star: minecraft_simple_recipe_format
            if minecraft:crafting_special_firework_star_fade: minecraft_simple_recipe_format
            if minecraft:crafting_special_repairitem: minecraft_simple_recipe_format
            if minecraft:crafting_special_tippedarrow: minecraft_simple_recipe_format
            if minecraft:crafting_special_bannerduplicate: minecraft_simple_recipe_format
            if minecraft:crafting_special_banneraddpattern: minecraft_simple_recipe_format
            if minecraft:crafting_special_shielddecoration: minecraft_simple_recipe_format
            if minecraft:crafting_special_shulkerboxcoloring: minecraft_simple_recipe_format
            if minecraft:crafting_special_suspiciousstew: minecraft_simple_recipe_format
            if minecraft:smelting: minecraft_smelting_format
            if minecraft:blasting: minecraft_smelting_format
            if minecraft:smoking: minecraft_smelting_format
            if minecraft:campfire_cooking: minecraft_smelting_format
            if minecraft:stonecutting:
               group: string
               ingredient: ingredient
               result: Slot
            if minecraft:smithing_transform:
               template: ingredient
               base: ingredient
               addition: ingredient
               result: Slot
            if minecraft:smithing_trim:
               template: ingredient
               base: ingredient
               addition: ingredient
            if minecraft:crafting_decorated_pot: minecraft_simple_recipe_format

   # MC: ClientboundProjectilePowerPacket
   packet_set_projectile_power:
      id: varint
      power: vec3f64

