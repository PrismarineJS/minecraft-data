            - right

   GameRule:
      name: string
      value: string

^play.toClient.types:
   SlotDisplay:
      type: varint =>
         - empty
         - any_fuel
         - with_any_potion
         - only_with_component
         - item
         - item_stack
         - tag
         - dyed_slot_demo
         - smithing_trim
         - with_remainder
         - composite
      data: type ?
         if empty or any_fuel: void
         if with_any_potion:
            base: SlotDisplay
         if only_with_component:
            source: SlotDisplay
            component: SlotComponentType
         if item: varint
         if item_stack: Slot
         if tag: string
         if dyed_slot_demo:
            dye: SlotDisplay
            target: SlotDisplay
         if smithing_trim:
            base: SlotDisplay
            material: SlotDisplay
            pattern: ["registryEntryHolder", { "baseName": "patternId", "otherwise": { "name": "data", "type": "ArmorTrimPattern" } }]
         if with_remainder:
            input: SlotDisplay
            remainder: SlotDisplay
         if composite: SlotDisplay[]varint

