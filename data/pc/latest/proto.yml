^play.toServer.types:
   # MC: ServerboundAttackPacket
   packet_attack:
      entityId: varint

   # MC: ServerboundChatCommandSignedPacket
   packet_chat_command_signed:
      command: string
      timestamp: i64
      salt: i64
      argumentSignatures: []varint
         argumentName: string
         signature: [
            "buffer",
            {
               "count": 256
            }
         ]
      messageCount: varint
      acknowledged: [
         "buffer",
         {
            "count": 3
         }
      ]
      checksum: u8

   # MC: ServerboundClientCommandPacket
   packet_client_command:
      actionId: varint =>
         - perform_respawn
         - request_stats
         - request_gamerule_values

   # MC: ServerboundContainerButtonClickPacket
   packet_enchant_item:
      windowId: ContainerID
      enchantment: varint

   # MC: ServerboundInteractPacket
   packet_use_entity:
      target: varint
      hand: varint =>
         - main_hand
         - off_hand
      location: lpVec3
      sneaking: bool

   # MC: ServerboundSetGameRulePacket
   packet_set_game_rule:
      entries: GameRule[]varint

   # MC: ServerboundSpectateEntityPacket
   packet_spectate_entity:
      entityId: varint

   packet:
      name: varint =>
      - teleport_confirm
      - attack
      - query_block_nbt
      - select_bundle_item
      - set_difficulty
      - change_gamemode
      - message_acknowledgement
