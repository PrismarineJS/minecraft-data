      - enchantment_glint_override
      - intangible_projectile
      - food
      - consumable
      - use_remainder
      - use_cooldown
      - damage_resistant
      - tool
      - weapon
      - attack_range
      - enchantable
      - equippable
      - repairable
      - glider
      - tooltip_style
      - death_protection
      - blocks_attacks
