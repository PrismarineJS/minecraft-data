      - container
      - block_state
      - bees
      - lock
      - container_loot
      - break_sound
      - villager/variant
      - wolf/variant
      - wolf/sound_variant
      - wolf/collar
      - fox/variant
      - salmon/size
      - parrot/variant
      - tropical_fish/pattern
      - tropical_fish/base_color
      - tropical_fish/pattern_color
      - mooshroom/variant
      - rabbit/variant
      - pig/variant
      - pig/sound_variant
      - cow/variant
      - cow/sound_variant
      - chicken/variant
      - chicken/sound_variant
      - zomie_nautilus/variant
