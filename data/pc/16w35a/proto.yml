!version: 16w35a
!base: 1.10

^play.toClient.types:
   packet_spawn_entity_living:
      entityId: varint
      entityUUID: UUID
      type: varint
      x: f64
      y: f64
      z: f64
      yaw: i8
      pitch: i8
      headPitch: i8
      velocity: vec3i16
      metadata: entityMetadata

   # MC: ClientboundPlayerInfoPacket
   packet_player_info:
      action: varint =>
         - add_player
         - update_game_mode
         - update_latency
         - update_display_name
         - remove_player
      ## https://github.com/extremeheat/extracted_minecraft_data/blob/client1.18.1/client/net/minecraft/network/protocol/game/ClientboundPlayerInfoPacket.java#L122
      data: []varint
         uuid: UUID
         _: ../action ?
            if add_player:
               name: string
               properties: []varint
                  name: string
                  value: string
                  signature?: string
               gamemode: varint
               ping: varint
               displayName?: string
            if update_game_mode:
               gamemode: varint
            if update_latency:
               ping: varint
            if update_display_name:
               displayName?: string
            if remove_player: void

   packet_collect:
      collectedEntityId: varint
      collectorEntityId: varint
      pickupItemCount: varint
