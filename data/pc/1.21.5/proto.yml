^play.toClient.types:
   packet_spawn_entity_experience_orb: !delete

   SlotDisplay:
      type: varint =>
         - empty
         - any_fuel
         - item
         - item_stack
         - tag
         - smithing_trim #TODO: Old versions have typo
         - with_remainder
         - composite
      data: type ?
         if empty or any_fuel: void
         if item: varint
         if item_stack: Slot
         if tag: string
         if smithing_trim:
            base: SlotDisplay
            material: SlotDisplay
            pattern: ["registryEntryHolder", { "baseName": "patternId", "otherwise": { "name": "data", "type": "ArmorTrimPattern" } }]
         if with_remainder:
            input: SlotDisplay
            remainder: SlotDisplay
         if composite: SlotDisplay[]varint

   RecipeDisplay:
      type: varint =>
         - crafting_shapeless
         - crafting_shaped
         - furnace
         - stonecutter
         - smithing
      data: type ?
         if crafting_shapeless:
            ingredients: SlotDisplay[]varint
            result: SlotDisplay
            craftingStation: SlotDisplay
         if crafting_shaped:
            width: varint
            height: varint
            ingredients: SlotDisplay[]varint
            result: SlotDisplay
            craftingStation: SlotDisplay
         if furnace:
            ingredient: SlotDisplay
            fuel: SlotDisplay
            result: SlotDisplay
            craftingStation: SlotDisplay
            duration: varint
            experience: f32
         if stonecutter:
            ingredient: SlotDisplay
            result: SlotDisplay
            craftingStation: SlotDisplay
         if smithing:
            template: SlotDisplay
            base: SlotDisplay
            addition: SlotDisplay
            result: SlotDisplay
            craftingStation: SlotDisplay

