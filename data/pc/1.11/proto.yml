!version: 1.11
!base: 16w35a

^play.toClient.types:
   # MC: ClientboundPlayerInfoPacket
   packet_player_info:
      action: varint =>
         - add_player
         - update_game_mode
         - update_latency
         - update_display_name
         - remove_player
      ## https://github.com/extremeheat/extracted_minecraft_data/blob/client1.13.2/client/net/minecraft/network/play/server/SPacketPlayerListItem.java#L114
      data: []varint
         uuid: UUID
         _: ../action ?
            if add_player:
               name: string
               properties: []varint
                  name: string
                  value: string
                  signature?: string
               gamemode: varint
               ping: varint
               displayName?: string
            if update_game_mode:
               gamemode: varint
            if update_latency:
               ping: varint
            if update_display_name:
               displayName?: string
            if remove_player: void

   packet_title:
      action: varint
      text: action ?
         if 0: string
         if 1: string
         if 2: string
         default: void
      fadeIn: action ?
         if 3: i32
         default: void
      stay: action ?
         if 3: i32
         default: void
      fadeOut: action ?
         if 3: i32
         default: void

^play.toServer.types:
   packet_block_place:
      location: position
      direction: varint
      hand: varint
      cursorX: f32
      cursorY: f32
      cursorZ: f32
