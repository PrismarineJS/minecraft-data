!version: 1.17
!base: 21w07a

^types:
   particleData: $compareTo ?
      if 4:
         blockState: varint
      if 15:
         red: f32
         green: f32
         blue: f32
         scale: f32
      if 16:
         fromRed: f32
         fromGreen: f32
         fromBlue: f32
         scale: f32
         toRed: f32
         toGreen: f32
         toBlue: f32
      if 25:
         blockState: varint
      if 36:
         item: slot
      if 37:
         origin: position
         positionType: string
         destination: positionType ?
            if minecraft:block: position
            if minecraft:entity: varint
         ticks: varint
      default: void

   minecraft_smelting_format:
      group: string
      ingredient: ingredient
      result: slot
      experience: f32
      cookTime: varint

   tags: []varint
      tagName: string
      entries: varint[]varint

^play.toClient.types:
   packet_transaction: !delete

   packet_entity: !delete

   packet_combat_event: !delete

   packet_entity_destroy: !delete

   packet_world_border: !delete

   packet_title: !delete

   minecraft_smelting_format: !delete

   tags: !delete

   packet_explosion:
      x: f32
      y: f32
      z: f32
      radius: f32
      affectedBlockOffsets: []varint
         x: i8
         y: i8
         z: i8
      playerMotionX: f32
      playerMotionY: f32
      playerMotionZ: f32

   packet_map_chunk:
      x: i32
      z: i32
      bitMap: i64[]varint
      heightmaps: nbt
      biomes: varint[]varint
      chunkData: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      blockEntities: nbt[]varint

   packet_update_light:
      chunkX: varint
      chunkZ: varint
      trustEdges: bool
      skyLightMask: i64[]varint
      blockLightMask: i64[]varint
      emptySkyLightMask: i64[]varint
      emptyBlockLightMask: i64[]varint
      skyLight: []varint
         _: u8[]varint
      blockLight: []varint
         _: u8[]varint

   packet_login:
      entityId: i32
      isHardcore: bool
      gameMode: u8
      previousGameMode: i8
      worldNames: string[]varint
      dimensionCodec: nbt
      dimension: nbt
      worldName: string
      hashedSeed: i64
      maxPlayers: varint
      viewDistance: varint
      reducedDebugInfo: bool
      enableRespawnScreen: bool
      isDebug: bool
      isFlat: bool

   packet_map:
      itemDamage: varint
      scale: i8
      locked: bool
      icons?: []varint
         type: varint
         x: i8
         z: i8
         direction: u8
         displayName?: string
      columns: u8
      rows: columns ?
         if 0: void
         default: u8
      x: columns ?
         if 0: void
         default: u8
      y: columns ?
         if 0: void
         default: u8
      data: columns ?
         if 0: void
         default: [
            "buffer",
            {
               "countType": "varint"
            }
         ]

   packet_end_combat_event:
      duration: varint
      entityId: i32

   packet_enter_combat_event:
      # Empty

   packet_death_combat_event:
      playerId: varint
      entityId: i32
      message: string

   packet_destroy_entity:
      entityId: varint

   packet_resource_pack_send:
      url: string
      hash: string
      forced: bool
      promptMessage?: string

   packet_spawn_position:
      location: position
      angle: f32

   packet_entity_update_attributes:
      entityId: varint
      properties: []varint
         name: string
         value: f64
         modifiers: []varint
            uuid: UUID
            amount: f64
            operation: i8

   packet_clear_titles:
      reset: bool

   packet_initialize_world_border:
      x: f64
      z: f64
      oldDiameter: f64
      newDiameter: f64
      speed: varlong
      portalTeleportBoundary: varint
      warningBlocks: varint
      warningTime: varint

   packet_action_bar:
      text: string

   packet_world_border_center:
      x: f64
      z: f64

   packet_world_border_lerp_size:
      oldDiameter: f64
      newDiameter: f64
      speed: varlong

   packet_world_border_size:
      diameter: f64

   packet_world_border_warning_delay:
      warningTime: varint

   packet_world_border_warning_reach:
      warningBlocks: varint

   packet_ping:
      id: i32

   packet_set_title_subtitle:
      text: string

   packet_set_title_text:
      text: string

   packet_set_title_time:
      fadeIn: i32
      stay: i32
      fadeOut: i32

   packet:
      name: varint =>
         0x00: spawn_entity
         0x01: spawn_entity_experience_orb
