         0x3d: unlock_recipes
         0x3e: entity_destroy
         0x3f: remove_entity_effect
         0x40: resource_pack_send
         0x41: respawn
         0x42: entity_head_rotation
         0x43: multi_block_change
         0x44: select_advancement_tab
         0x45: server_data
         0x46: action_bar
         0x47: world_border_center
         0x48: world_border_lerp_size
         0x49: world_border_size
         0x4a: world_border_warning_delay
         0x4b: world_border_warning_reach
         0x4c: camera
         0x4d: held_item_slot
         0x4e: update_view_position
         0x4f: update_view_distance
         0x50: spawn_position
         0x51: scoreboard_display_objective
         0x52: entity_metadata
         0x53: attach_entity
         0x54: entity_velocity
         0x55: entity_equipment
         0x56: experience
         0x57: update_health
         0x58: scoreboard_objective
         0x59: set_passengers
         0x5a: teams
         0x5b: scoreboard_score
         0x5c: simulation_distance
         0x5d: set_title_subtitle
         0x5e: update_time
         0x5f: set_title_text
         0x60: set_title_time
