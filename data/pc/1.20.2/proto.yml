!version: 1.20.2
!base: 1.20

^types:
   nbt: !delete

   optionalNbt: !delete

   anonymousNbt: native

   anonOptionalNbt: native

   slot:
      present: bool
      _: present ?
         if false: void
         if true:
            itemId: varint
            itemCount: i8
            nbtData: anonOptionalNbt

   entityMetadataItem: $compareTo ?
      if byte: i8
      if int: varint
      if long: varlong
      if float: f32
      if string: string
      if component: string
      if optional_component: [
         "option",
         "string"
      ]
      if item_stack: slot
      if boolean: bool
      if rotations:
         pitch: f32
         yaw: f32
         roll: f32
      if block_pos: position
      if optional_block_pos: [
         "option",
         "position"
      ]
      if direction: varint
      if optional_uuid: [
         "option",
         "UUID"
      ]
      if block_state: varint
      if optional_block_state: optvarint
      if compound_tag: anonymousNbt
      if particle: particle
      if villager_data:
         villagerType: varint
         villagerProfession: varint
         level: varint
      if optional_unsigned_int: optvarint
      if pose: varint
      if cat_variant: varint
      if frog_variant: varint
      if optional_global_pos: [
         "option",
         "string"
      ]
      if painting_variant: varint
      if sniffer_state: varint
      if vector3: vec3f
      if quaternion: vec4f

   chunkBlockEntity:
      _: [
         "bitfield",
         [
            {
               "name": "x",
               "size": 4,
               "signed": false
            },
            {
               "name": "z",
               "size": 4,
               "signed": false
            }
         ]
      ]
      y: i16
      type: varint
      nbtData: anonOptionalNbt

^login.toServer.types:
   packet_login_start:
      username: string
      playerUUID: UUID

   packet_login_acknowledged:
      # Empty

   packet:
      name: varint =>
         0x00: login_start
         0x01: encryption_begin
         0x02: login_plugin_response
         0x03: login_acknowledged
      params: name ?
         if login_start: packet_login_start
         if encryption_begin: packet_encryption_begin
         if login_plugin_response: packet_login_plugin_response
         if login_acknowledged: packet_login_acknowledged

^configuration.toClient.types:
   packet_custom_payload:
      channel: string
      data: restBuffer

   packet_disconnect:
      reason: string

   packet_finish_configuration:
      # Empty

   packet_keep_alive:
      keepAliveId: i64

   packet_ping:
      id: i32

   packet_registry_data:
      codec: anonymousNbt

   packet_resource_pack_send:
      url: string
      hash: string
      forced: bool
      promptMessage?: string

   packet_feature_flags:
      features: string[]varint

   packet_tags:
      tags: []varint
         tagType: string
         tags: tags

   packet:
      name: varint =>
         0x00: custom_payload
         0x01: disconnect
         0x02: finish_configuration
         0x03: keep_alive
         0x04: ping
         0x05: registry_data
         0x06: resource_pack_send
         0x07: feature_flags
         0x08: tags
      params: name ?
         if custom_payload: packet_custom_payload
         if disconnect: packet_disconnect
         if finish_configuration: packet_finish_configuration
         if keep_alive: packet_keep_alive
         if ping: packet_ping
         if registry_data: packet_registry_data
         if resource_pack_send: packet_resource_pack_send
         if feature_flags: packet_feature_flags
         if tags: packet_tags

^configuration.toServer.types:
   packet_settings:
      locale: string
      viewDistance: i8
      chatFlags: varint
      chatColors: bool
      skinParts: u8
      mainHand: varint
      enableTextFiltering: bool
      enableServerListing: bool

   packet_custom_payload:
      channel: string
      data: restBuffer

   packet_finish_configuration:
      # Empty

   packet_keep_alive:
      keepAliveId: i64

   packet_pong:
      id: i32

   packet_resource_pack_receive:
      result: varint

   packet:
      name: varint =>
         0x00: settings
         0x01: custom_payload
         0x02: finish_configuration
         0x03: keep_alive
         0x04: pong
         0x05: resource_pack_receive
      params: name ?
         if settings: packet_settings
         if custom_payload: packet_custom_payload
         if finish_configuration: packet_finish_configuration
         if keep_alive: packet_keep_alive
         if pong: packet_pong
         if resource_pack_receive: packet_resource_pack_receive

^play.toClient.types:
   packet_named_entity_spawn: !delete

   packet_feature_flags: !delete

   packet_advancements:
      reset: bool
      advancementMapping: []varint
         key: string
         value:
            parentId?: string
            displayData?:
               title: string
               description: string
               icon: slot
               frameType: varint
               flags: [
                  "bitfield",
                  [
                     {
                        "name": "_unused",
                        "size": 29,
                        "signed": false
                     },
                     {
                        "name": "hidden",
                        "size": 1,
                        "signed": false
                     },
                     {
                        "name": "show_toast",
                        "size": 1,
                        "signed": false
                     },
                     {
                        "name": "has_background_texture",
                        "size": 1,
                        "signed": false
                     }
                  ]
               ]
               backgroundTexture: flags/has_background_texture ?
                  if 1: string
                  default: void
               xCord: f32
               yCord: f32
            requirements: []varint
               _: string[]varint
            sendsTelemtryData: bool
      identifiers: string[]varint
      progressMapping: []varint
         key: string
         value: []varint
            criterionIdentifier: string
            criterionProgress?: i64

   packet_tile_entity_data:
      location: position
      action: varint
      nbtData: anonOptionalNbt

   packet_chunk_batch_finished:
      batchSize: varint

   packet_chunk_batch_start:
      # Empty

   packet_nbt_query_response:
      transactionId: varint
      nbt: anonOptionalNbt

   packet_unload_chunk:
      chunkZ: i32
      chunkX: i32

   packet_map_chunk:
      x: i32
      z: i32
      heightmaps: anonymousNbt
      chunkData: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      blockEntities: chunkBlockEntity[]varint
      skyLightMask: i64[]varint
      blockLightMask: i64[]varint
      emptySkyLightMask: i64[]varint
      emptyBlockLightMask: i64[]varint
      skyLight: []varint
         _: u8[]varint
      blockLight: []varint
         _: u8[]varint

   packet_login:
      entityId: i32
      isHardcore: bool
      worldNames: string[]varint
      maxPlayers: varint
      viewDistance: varint
      simulationDistance: varint
      reducedDebugInfo: bool
      enableRespawnScreen: bool
      doLimitedCrafting: bool
      worldType: string
      worldName: string
      hashedSeed: i64
      gameMode: u8
      previousGameMode: i8
      isDebug: bool
      isFlat: bool
      death?:
         dimensionName: string
         location: position
      portalCooldown: varint

   packet_respawn:
      dimension: string
      worldName: string
      hashedSeed: i64
      gamemode: i8
      previousGamemode: u8
      isDebug: bool
      isFlat: bool
      death?:
