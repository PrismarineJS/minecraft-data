^play.toServer.types:
   # MC: ServerboundChangeDifficultyPacket
   packet_set_difficulty:
      newDifficulty: varint =>
         0: peaceful
         1: easy
         2: normal
         3: hard

   # MC: ServerboundChangeGameModePacket
   packet_change_gamemode:
      mode: varint =>
         0: survival
         1: creative
         2: adventure
         3: spectator

   # MC: ServerboundPlayerCommandPacket
   packet_entity_action:
      entityId: varint
      actionId: varint =>
         - leave_bed
         - start_sprinting
         - stop_sprinting
         - start_horse_jump
         - stop_horse_jump
         - open_vehicle_inventory
         - start_elytra_flying
      jumpBoost: varint

   # MC: ServerboundSetStructureBlockPacket
   packet_update_structure_block:
      location: position
      action: varint
      mode: varint
      name: string
      offset_x: i8
      offset_y: i8
      offset_z: i8
      size_x: i8
      size_y: i8
      size_z: i8
      mirror: varint
      rotation: varint
      metadata: string
      integrity: f32
      seed: varint
      # New `strict` flag
      flags: u8 =>
         - ignore_entities
         - show_air
         - show_bounding_box
         - strict

   packet:
      name: varint =>
      - teleport_confirm
      - query_block_nbt
      - select_bundle_item
      - set_difficulty
      - change_gamemode
      - message_acknowledgement
