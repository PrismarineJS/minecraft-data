!version: 17w15a
!base: 1.11

^types:
   entityMetadataItem: $compareTo ?
      if 0: i8
      if 1: varint
      if 2: f32
      if 3: string
      if 4: string
      if 5: slot
      if 6: bool
      if 7:
         pitch: f32
         yaw: f32
         roll: f32
      if 8: position
      if 9: [
         "option",
         "position"
      ]
      if 10: varint
      if 11: [
         "option",
         "UUID"
      ]
      if 12: varint
      if 13: nbt

^play.toClient.types:
   packet_advancements:
      reset: bool
      advancementMapping: []varint
         key: string
         value:
            parentId?: string
            displayData?:
               title: string
               description: string
               icon: varint
               frameType: varint
               backgroundTexture?: string
               xCord: varint
               yCord: varint
            criteria: []varint
               key: string
               value: void
            requirements: []varint
               _: string[]varint
      identifiers: string[]varint
      progressMapping: []varint
         key: string
         value: []varint
            criterionIdentifier: string
            criterionProgress?: i64

   # MC: ClientboundPlayerInfoPacket
   packet_player_info:
      action: varint =>
         - add_player
         - update_game_mode
         - update_latency
         - update_display_name
         - remove_player
      ## https://github.com/extremeheat/extracted_minecraft_data/blob/client1.18.1/client/net/minecraft/network/protocol/game/ClientboundPlayerInfoPacket.java#L122
      data: []varint
         uuid: UUID
         _: ../action ?
            if add_player:
               name: string
               properties: []varint
                  name: string
                  value: string
                  signature?: string
               gamemode: varint
               ping: varint
               displayName?: string
            if update_game_mode:
               gamemode: varint
            if update_latency:
               ping: varint
            if update_display_name:
               displayName?: string
            if remove_player: void

   packet_unlock_recipes:
      notification: bool
      craftingBookOpen: bool
      filteringCraftable: bool
      recipes: []varint
         identifier: string
         isUnlocked: bool
         hasBeenDisplayed: bool

   packet_sound_effect:
      soundCategory: varint
      soundId: varint
      parrottedEntityType: string
      x: i32
      y: i32
      z: i32
      volume: f32
      pitch: f32

   packet:
      name: varint =>
         0x00: spawn_entity
         0x01: spawn_entity_experience_orb
         0x02: spawn_entity_weather
         0x03: spawn_entity_living
         0x04: spawn_entity_painting
         0x05: named_entity_spawn
         0x06: animation
         0x07: statistics
         0x08: advancements
         0x09: block_break_animation
         0x0a: tile_entity_data
         0x0b: block_action
         0x0c: block_change
         0x0d: boss_bar
         0x0e: difficulty
         0x0f: tab_complete
         0x10: chat
         0x11: multi_block_change
         0x12: transaction
         0x13: close_window
         0x14: open_window
         0x15: window_items
         0x16: craft_progress_bar
