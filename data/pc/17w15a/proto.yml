^play.toServer.types:
   packet_prepare_crafting_grid:
      windowId: u8
      actionNumber: u16
      returnEntry: []u8
         item: slot
         craftingSlot: u8
         playerSlot: u8
      prepareEntry: []u8
         item: slot
         craftingSlot: u8
         playerSlot: u8

   packet_crafting_book_data:
      type: i32
      _: type ?
         if 1:
            displayedRecipe: string
         if 2:
            craftingBookOpen: bool
            craftingFilter: bool

   packet:
      name: varint =>
         0x00: teleport_confirm
         0x01: prepare_crafting_grid
         0x02: tab_complete
         0x03: chat
         0x04: client_command
         0x05: settings
         0x06: transaction
         0x07: enchant_item
         0x08: window_click
         0x09: close_window
         0x0a: custom_payload
