!version: 1.17.1
!base: 1.17

^play.toClient.types:
   packet_destroy_entity: !delete

   packet_window_items:
      windowId: u8
      stateId: varint
      items: slot[]varint
      carriedItem: slot

   packet_set_slot:
      windowId: i8
      stateId: varint
      slot: i16
      item: slot

   packet_entity_destroy:
      entityIds: varint[]varint

   packet:
      name: varint =>
         0x00: spawn_entity
         0x01: spawn_entity_experience_orb
         0x02: spawn_entity_living
         0x03: spawn_entity_painting
         0x04: named_entity_spawn
         0x05: sculk_vibration_signal
