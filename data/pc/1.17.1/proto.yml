^play.toServer.types:
   packet_edit_book:
      hand: varint
      pages: string[]varint
      title?: string

   packet_window_click:
      windowId: u8
      stateId: varint
      slot: i16
      mouseButton: i8
      mode: varint
      changedSlots: []varint
         location: i16
         item: slot
      cursorItem: slot
