^play.toServer.types:
   packet_steer_vehicle: !delete

   # MC: ServerboundSelectBundleItemPacket
   packet_select_bundle_item:
      slotId: varint
      selectedItemIndex: varint

   # MC: ServerboundClientTickEndPacket
   packet_tick_end:
      # Empty

   ## (Settings is common) ##
   # MC: ServerboundCommandSuggestionPacket
   packet_tab_complete:
      transactionId: varint
      text: string

   # MC: ServerboundContainerSlotStateChangedPacket
   packet_set_slot_state:
      slot_id: varint
      window_id: ContainerID
      state: bool

   ## (ServerboundCookieResponsePacket is common)
   # MC: ServerboundCustomPayloadPacket
   packet_custom_payload:
      channel: string
      data: restBuffer

   MovementFlags: ["bitflags", {
      "type": "u8",
      "flags": ["onGround", "hasHorizontalCollision"]
   }]

   # MC: ServerboundMovePlayerPacket.Pos
   packet_position:
      x: f64
      y: f64
      z: f64
      flags: MovementFlags

   # MC: ServerboundMovePlayerPacket.PosRot
   packet_position_look:
      x: f64
      y: f64
      z: f64
      yaw: f32
      pitch: f32
      flags: MovementFlags

   # MC: ServerboundMovePlayerPacket.Rot
   packet_look:
      yaw: f32
      pitch: f32
      flags: MovementFlags

   # MC: ServerboundMovePlayerPacket.StatusOnly
   packet_flying:
      flags: MovementFlags

   # MC: ServerboundPlaceRecipePacket
   packet_craft_recipe_request:
      windowId: ContainerID
      recipeId: varint
      makeAll: bool

   # MC: ServerboundPlayerInputPacket
   # previously: packet_steer_vehicle
   packet_player_input:
      ## client/net/minecraft/world/entity/player/Input.java
      inputs: ["bitflags", {
         "type": "u8",
         "flags": ["forward", "backward", "left", "right", "jump", "shift", "sprint"]
      }]

   # MC: ServerboundRecipeBookSeenRecipePacket
   packet_displayed_recipe:
      recipeId: varint

   # MC: ServerboundUseItemOnPacket
   packet_block_place:
      hand: varint
      location: position
      direction: varint
      cursorX: f32
      cursorY: f32
      cursorZ: f32
      insideBlock: bool
      worldBorderHit: bool
      sequence: varint

   packet:
      name: varint =>
      - teleport_confirm
      - query_block_nbt
      - select_bundle_item
      - set_difficulty
      - message_acknowledgement
      - chat_command
      - chat_command_signed
      - chat_message
      - chat_session_update
      - chunk_batch_received
      - client_command
      - tick_end
      - settings
      - tab_complete
      - configuration_acknowledged
      # Maybe rename enchant_item if it is used for other things too
      - enchant_item
      - window_click
      - close_window
      - set_slot_state
      - cookie_response
      - custom_payload
      - debug_sample_subscription
      - edit_book
      - query_entity_nbt
      - use_entity
      - generate_structure
      - keep_alive
      - lock_difficulty
      - position
      - position_look
      - look
      - flying
      - vehicle_move
      - steer_boat
      - pick_item
      - ping_request
      - craft_recipe_request
      - abilities
      - block_dig
      - entity_action
      - player_input
      - pong
      - recipe_book
      - displayed_recipe
      - name_item
      - resource_pack_receive
      - advancement_tab
      - select_trade
      - set_beacon_effect
      - held_item_slot
      - update_command_block
      - update_command_block_minecart
      - set_creative_slot
      - update_jigsaw_block
      - update_structure_block
      - update_sign
      - arm_animation
      - spectate
      - block_place
      - use_item
      params: name ?
         if teleport_confirm: packet_teleport_confirm
         if query_block_nbt: packet_query_block_nbt
         if select_bundle_item: packet_select_bundle_item
         if set_difficulty: packet_set_difficulty
