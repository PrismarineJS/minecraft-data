!version: 1.21.8
!base: 1.21.6

^types:
   # MC: ServerboundCookieResponsePacket
   packet_common_cookie_response:
      key: string
      value: ByteArray

^play.toClient.types:
   ## (ClientboundCustomReportDetailsPacket, ClientboundServerLinksPacket is common)
   # MC: ClientboundTrackedWaypointPacket
   packet_tracked_waypoint:
      operation: varint =>
         0: track
         1: untrack
         2: update
      waypoint:
         hasUUID: bool
         _: hasUUID ?
            if true:
               uuid: UUID
            if false:
               id: string
         icon:
            style: string
            color?:
               red: u8
               green: u8
               blue: u8
         type: varint =>
            0: empty
            1: vec3i
            2: chunk
            3: azimuth
         data: type ?
            if vec3i: vec3i
            if chunk:
               chunkX: varint
               chunkZ: varint
            if azimuth: f32
