!version: 17w18b
!base: 17w15a

^play.toClient.types:
   packet_advancements:
      reset: bool
      advancementMapping: []varint
         key: string
         value:
            parentId?: string
            displayData?:
               title: string
               description: string
               icon: slot
               frameType: varint
               backgroundTexture?: string
               showToast: bool
               xCord: f32
               yCord: f32
            criteria: []varint
               key: string
               value: void
            requirements: []varint
               _: string[]varint
      identifiers: string[]varint
      progressMapping: []varint
         key: string
         value: []varint
            criterionIdentifier: string
            criterionProgress?: i64

   packet_unlock_recipes:
      action: i16
      craftingBookOpen: bool
      filteringCraftable: bool
      recipes1: i32[]varint
      recipes2: i32[]varint

   packet_sound_effect:
      soundId: varint
      soundCategory: varint
      x: i32
      y: i32
      z: i32
      volume: f32
      pitch: f32

^play.toServer.types:
   packet_prepare_crafting_grid:
      windowId: u8
      actionNumber: u16
      returnEntry: []u16
         item: slot
         craftingSlot: u8
         playerSlot: u8
      prepareEntry: []u16
         item: slot
         craftingSlot: u8
         playerSlot: u8
