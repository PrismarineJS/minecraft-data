!version: 20w13b
!base: 1.15.2

^types:
   minecraft_smelting_format: !delete

   tags: !delete

   particleData: $compareTo ?
      if 3:
         blockState: varint
      if 14:
         red: f32
         green: f32
         blue: f32
         scale: f32
      if 23:
         blockState: varint
      if 34:
         item: slot
      default: void

^login.toClient.types:
   packet_success:
      uuid: UUID
      username: string

^play.toClient.types:
   minecraft_smelting_format:
      group: string
      ingredient: ingredient
      result: slot
      experience: f32
      cookTime: varint

   tags: []varint
      tagName: string
      entries: varint[]varint

   packet:
      name: varint =>
         0x00: spawn_entity
         0x01: spawn_entity_experience_orb
         0x02: spawn_entity_weather
         0x03: spawn_entity_living
         0x04: spawn_entity_painting
         0x05: named_entity_spawn
         0x06: animation
         0x07: statistics
         0x08: acknowledge_player_digging
         0x09: block_break_animation
         0x0a: tile_entity_data
         0x0b: block_action
         0x0c: block_change
         0x0d: boss_bar
         0x0e: difficulty
         0x0f: chat
         0x10: multi_block_change
         0x11: tab_complete
         0x12: declare_commands
         0x13: transaction
         0x14: close_window
         0x15: window_items
         0x16: craft_progress_bar
         0x17: set_slot
         0x18: set_cooldown
         0x19: custom_payload
         0x1a: named_sound_effect
         0x1b: kick_disconnect
         0x1c: entity_status
         0x1d: explosion
         0x1e: unload_chunk
         0x1f: game_state_change
         0x20: open_horse_window
         0x21: keep_alive
         0x22: map_chunk
         0x23: world_event
         0x24: world_particles
         0x25: update_light
         0x26: login
         0x27: map
         0x28: trade_list
         0x29: rel_entity_move
         0x2a: entity_move_look
         0x2b: entity_look
         0x2c: entity
         0x2d: vehicle_move
         0x2e: open_book
         0x2f: open_window
         0x30: open_sign_entity
         0x31: craft_recipe_response
         0x32: abilities
         0x33: combat_event
         0x34: player_info
         0x35: face_player
         0x36: position
         0x37: unlock_recipes
         0x38: entity_destroy
         0x39: remove_entity_effect
         0x3a: resource_pack_send
         0x3b: respawn
         0x3c: entity_head_rotation
         0x3d: select_advancement_tab
         0x3e: world_border
         0x3f: camera
         0x40: held_item_slot
         0x41: update_view_position
         0x42: update_view_distance
         0x43: spawn_position
         0x44: scoreboard_display_objective
         0x45: entity_metadata
