         0x4c: set_passengers
         0x4d: teams
         0x4e: scoreboard_score
         0x4f: update_time
         0x50: title
         0x51: entity_sound_effect
         0x52: sound_effect
         0x53: stop_sound
         0x54: playerlist_header
         0x55: nbt_query_response
         0x56: collect
         0x57: entity_teleport
         0x58: advancements
         0x59: entity_update_attributes
         0x5a: entity_effect
