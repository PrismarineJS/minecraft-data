!version: 1.14
!base: 1.13.2

^types:
   optvarint: varint

   particleData: $compareTo ?
      if 3:
         blockState: varint
      if 14:
         red: f32
         green: f32
         blue: f32
         scale: f32
      if 23:
         blockState: varint
      if 32:
         item: slot
      default: void

   position: [
      "bitfield",
      [
         {
            "name": "x",
            "size": 26,
            "signed": true
         },
         {
            "name": "z",
            "size": 26,
            "signed": true
         },
         {
            "name": "y",
            "size": 12,
            "signed": true
         }
      ]
   ]

   entityMetadataItem: $compareTo ?
      if 0: i8
      if 1: varint
      if 2: f32
      if 3: string
      if 4: string
      if 5: [
         "option",
         "string"
      ]
      if 6: slot
      if 7: bool
      if 8:
         pitch: f32
         yaw: f32
         roll: f32
      if 9: position
      if 10: [
         "option",
         "position"
      ]
      if 11: varint
      if 12: [
         "option",
         "UUID"
      ]
      if 13: varint
      if 14: nbt
      if 15: particle
      if 16:
         villagerType: varint
         villagerProfession: varint
         level: varint
      if 17: optvarint
      if 18: varint

   minecraft_smelting_format:
      group: string
      ingredient: ingredient
      result: slot
      experience: f32
      cookTime: varint

   tags: []varint
      tagName: string
      entries: varint[]varint

^play.toClient.types:
   packet_bed: !delete

   tags: !delete

   packet_spawn_entity:
      entityId: varint
      objectUUID: UUID
      type: varint
      x: f64
      y: f64
      z: f64
      pitch: i8
      yaw: i8
      objectData: i32
      velocity: vec3i16

   packet_difficulty:
      difficulty: u8
      difficultyLocked: bool

   packet_open_window:
      windowId: varint
      inventoryType: varint
      windowTitle: string

   packet_open_horse_window:
      windowId: u8
      nbSlots: varint
      entityId: i32

   packet_map_chunk:
      x: i32
      z: i32
      groundUp: bool
      bitMap: varint
      heightmaps: nbt
      chunkData: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      blockEntities: nbt[]varint

   packet_update_light:
      chunkX: varint
      chunkZ: varint
      skyLightMask: varint
      blockLightMask: varint
      emptySkyLightMask: varint
      emptyBlockLightMask: varint
      data: restBuffer

   packet_login:
      entityId: i32
      gameMode: u8
      dimension: i32
      maxPlayers: u8
      levelType: string
      viewDistance: varint
      reducedDebugInfo: bool

   packet_map:
      itemDamage: varint
      scale: i8
      trackingPosition: bool
      locked: bool
      icons: []varint
         type: varint
         x: i8
         z: i8
         direction: u8
         displayName?: string
      columns: i8
      rows: columns ?
         if 0: void
         default: i8
      x: columns ?
         if 0: void
         default: i8
      y: columns ?
         if 0: void
         default: i8
      data: columns ?
         if 0: void
         default: [
            "buffer",
            {
               "countType": "varint"
            }
         ]

   packet_trade_list:
      windowId: varint
      trades: []u8
         inputItem1: slot
         outputItem: slot
         inputItem2?: slot
         tradeDisabled: bool
         nbTradeUses: i32
         maximumNbTradeUses: i32
         xp: i32
         specialPrice: i32
         priceMultiplier: f32
      villagerLevel: varint
      experience: varint
      isRegularVillager: bool

   packet_open_book:
      hand: varint

   packet_respawn:
      dimension: i32
      gamemode: u8
      levelType: string

   packet_update_view_position:
      chunkX: varint
      chunkZ: varint

   packet_update_view_distance:
      viewDistance: varint

   packet_entity_sound_effect:
      soundId: varint
      soundCategory: varint
      entityId: varint
      volume: f32
      pitch: f32

   packet_declare_recipes:
      recipes: []varint
         type: string
         recipeId: string
         data: type ?
            if minecraft:crafting_shapeless:
               group: string
               ingredients: ingredient[]varint
               result: slot
            if minecraft:crafting_shaped:
               width: varint
               height: varint
               group: string
               ingredients: []$width
                  _: ingredient[]$height
               result: slot
            if minecraft:crafting_special_armordye: void
            if minecraft:crafting_special_bookcloning: void
            if minecraft:crafting_special_mapcloning: void
            if minecraft:crafting_special_mapextending: void
            if minecraft:crafting_special_firework_rocket: void
            if minecraft:crafting_special_firework_star: void
            if minecraft:crafting_special_firework_star_fade: void
            if minecraft:crafting_special_repairitem: void
            if minecraft:crafting_special_tippedarrow: void
            if minecraft:crafting_special_bannerduplicate: void
            if minecraft:crafting_special_banneraddpattern: void
            if minecraft:crafting_special_shielddecoration: void
            if minecraft:crafting_special_shulkerboxcoloring: void
            if minecraft:crafting_special_suspiciousstew: void
            if minecraft:smelting: minecraft_smelting_format
            if minecraft:blasting: minecraft_smelting_format
            if minecraft:smoking: minecraft_smelting_format
            if minecraft:campfire_cooking: minecraft_smelting_format
            if minecraft:stonecutting:
               group: string
               ingredient: ingredient
               result: slot

   packet_tags:
      blockTags: tags
      itemTags: tags
      fluidTags: tags
      entityTags: tags

   packet:
      name: varint =>
         0x00: spawn_entity
         0x01: spawn_entity_experience_orb
         0x02: spawn_entity_weather
         0x03: spawn_entity_living
         0x04: spawn_entity_painting
         0x05: named_entity_spawn
         0x06: animation
         0x07: statistics
         0x08: block_break_animation
         0x09: tile_entity_data
         0x0a: block_action
         0x0b: block_change
         0x0c: boss_bar
         0x0d: difficulty
         0x0e: chat
         0x0f: multi_block_change
         0x10: tab_complete
         0x11: declare_commands
         0x12: transaction
         0x13: close_window
         0x14: window_items
         0x15: craft_progress_bar
         0x16: set_slot
         0x17: set_cooldown
         0x18: custom_payload
         0x19: named_sound_effect
         0x1a: kick_disconnect
         0x1b: entity_status
         0x1c: explosion
         0x1d: unload_chunk
         0x1e: game_state_change
         0x1f: open_horse_window
         0x20: keep_alive
         0x21: map_chunk
         0x22: world_event
         0x23: world_particles
         0x24: update_light
         0x25: login
         0x26: map
         0x27: trade_list
         0x28: rel_entity_move
         0x29: entity_move_look
         0x2a: entity_look
         0x2b: entity
         0x2c: vehicle_move
         0x2d: open_book
         0x2e: open_window
         0x2f: open_sign_entity
         0x30: craft_recipe_response
         0x31: abilities
         0x32: combat_event
         0x33: player_info
         0x34: face_player
         0x35: position
         0x36: unlock_recipes
         0x37: entity_destroy
         0x38: remove_entity_effect
         0x39: resource_pack_send
         0x3a: respawn
         0x3b: entity_head_rotation
         0x3c: select_advancement_tab
         0x3d: world_border
         0x3e: camera
         0x3f: held_item_slot
         0x40: update_view_position
         0x41: update_view_distance
         0x42: scoreboard_display_objective
         0x43: entity_metadata
         0x44: attach_entity
         0x45: entity_velocity
         0x46: entity_equipment
         0x47: experience
         0x48: update_health
         0x49: scoreboard_objective
         0x4a: set_passengers
         0x4b: teams
         0x4c: scoreboard_score
         0x4d: spawn_position
         0x4e: update_time
         0x4f: title
         0x50: entity_sound_effect
         0x51: sound_effect
         0x52: stop_sound
         0x53: playerlist_header
         0x54: nbt_query_response
         0x55: collect
         0x56: entity_teleport
         0x57: advancements
         0x58: entity_update_attributes
         0x59: entity_effect
         0x5a: declare_recipes
         0x5b: tags
      params: name ?
         if spawn_entity: packet_spawn_entity
         if spawn_entity_experience_orb: packet_spawn_entity_experience_orb
         if spawn_entity_weather: packet_spawn_entity_weather
         if spawn_entity_living: packet_spawn_entity_living
         if spawn_entity_painting: packet_spawn_entity_painting
         if named_entity_spawn: packet_named_entity_spawn
         if animation: packet_animation
