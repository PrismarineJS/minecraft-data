^play.toServer.types:
   packet_chat_command:
      command: string
      timestamp: i64
      salt: i64
      argumentSignatures: []varint
         argumentName: string
         signature: [
            "buffer",
            {
               "countType": "varint"
            }
         ]
      signedPreview: bool
      previousMessages: previousMessages
      lastRejectedMessage?:
         sender: UUID
         signature: [
            "buffer",
            {
               "countType": "varint"
            }
         ]

   packet_chat_message:
      message: string
      timestamp: i64
      salt: i64
      signature: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      signedPreview: bool
      previousMessages: previousMessages
      lastRejectedMessage?:
         sender: UUID
         signature: [
            "buffer",
            {
               "countType": "varint"
            }
         ]

   packet_message_acknowledgement:
      previousMessages: previousMessages
      lastRejectedMessage?:
         sender: UUID
         signature: [
            "buffer",
            {
               "countType": "varint"
            }
         ]

   packet:
      name: varint =>
         0x00: teleport_confirm
         0x01: query_block_nbt
         0x02: set_difficulty
         0x03: message_acknowledgement
         0x04: chat_command
         0x05: chat_message
         0x06: chat_preview
         0x07: client_command
         0x08: settings
         0x09: tab_complete
         0x0a: enchant_item
         0x0b: window_click
         0x0c: close_window
         0x0d: custom_payload
         0x0e: edit_book
         0x0f: query_entity_nbt
         0x10: use_entity
         0x11: generate_structure
         0x12: keep_alive
         0x13: lock_difficulty
         0x14: position
         0x15: position_look
         0x16: look
         0x17: flying
         0x18: vehicle_move
         0x19: steer_boat
         0x1a: pick_item
         0x1b: craft_recipe_request
         0x1c: abilities
         0x1d: block_dig
         0x1e: entity_action
         0x1f: steer_vehicle
         0x20: pong
         0x21: recipe_book
         0x22: displayed_recipe
         0x23: name_item
         0x24: resource_pack_receive
         0x25: advancement_tab
         0x26: select_trade
         0x27: set_beacon_effect
         0x28: held_item_slot
         0x29: update_command_block
         0x2a: update_command_block_minecart
         0x2b: set_creative_slot
         0x2c: update_jigsaw_block
         0x2d: update_structure_block
         0x2e: update_sign
         0x2f: arm_animation
         0x30: spectate
         0x31: block_place
         0x32: use_item
      params: name ?
         if teleport_confirm: packet_teleport_confirm
         if query_block_nbt: packet_query_block_nbt
         if set_difficulty: packet_set_difficulty
         if message_acknowledgement: packet_message_acknowledgement
         if chat_command: packet_chat_command
         if chat_message: packet_chat_message
         if chat_preview: packet_chat_preview
         if client_command: packet_client_command
         if settings: packet_settings
         if tab_complete: packet_tab_complete
         if enchant_item: packet_enchant_item
         if window_click: packet_window_click
         if close_window: packet_close_window
         if custom_payload: packet_custom_payload
         if edit_book: packet_edit_book
         if query_entity_nbt: packet_query_entity_nbt
         if use_entity: packet_use_entity
         if generate_structure: packet_generate_structure
         if keep_alive: packet_keep_alive
         if lock_difficulty: packet_lock_difficulty
         if position: packet_position
         if position_look: packet_position_look
