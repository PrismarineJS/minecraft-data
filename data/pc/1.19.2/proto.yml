!version: 1.19.2
!base: 1.19

^types:
   previousMessages: []varint
      messageSender: UUID
      messageSignature: [
         "buffer",
         {
            "countType": "varint"
         }
      ]

   entityMetadataItem: $compareTo ?
      if 0: i8
      if 1: varint
      if 2: f32
      if 3: string
      if 4: string
      if 5: [
         "option",
         "string"
      ]
      if 6: slot
      if 7: bool
      if 8:
         pitch: f32
         yaw: f32
         roll: f32
      if 9: position
      if 10: [
         "option",
         "position"
      ]
      if 11: varint
      if 12: [
         "option",
         "UUID"
      ]
      if 13: varint
      if 14: nbt
      if 15: particle
      if 16:
         villagerType: varint
         villagerProfession: varint
         level: varint
      if 17: optvarint
      if 18: varint
      if 19: varint
      if 20: varint
      if 21: [
         "option",
         "string"
      ]
      if 22: varint

^login.toServer.types:
   packet_login_start:
      username: string
      signature?:
         timestamp: i64
         publicKey: [
            "buffer",
            {
               "countType": "varint"
            }
         ]
         signature: [
            "buffer",
            {
               "countType": "varint"
            }
         ]
      playerUUID?: UUID

^play.toClient.types:
   packet_multi_block_change:
      chunkCoordinates: [
         "bitfield",
         [
            {
               "name": "x",
               "size": 22,
               "signed": true
            },
            {
               "name": "z",
               "size": 22,
               "signed": true
            },
            {
               "name": "y",
               "size": 20,
               "signed": true
            }
         ]
      ]
      suppressLightUpdates: bool
      records: varint[]varint

   packet_chat_suggestions:
      action: varint
      entries: string[]varint

   packet_hide_message:
      signature: [
         "buffer",
         {
            "countType": "varint"
         }
      ]

   packet_trade_list:
      windowId: varint
      trades: []varint
         inputItem1: slot
         outputItem: slot
         inputItem2: slot
         tradeDisabled: bool
         nbTradeUses: i32
         maximumNbTradeUses: i32
         xp: i32
         specialPrice: i32
         priceMultiplier: f32
         demand: i32
      villagerLevel: varint
      experience: varint
      isRegularVillager: bool
      canRestock: bool

   packet_player_chat:
      previousSignature?: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      senderUuid: UUID
      signature: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      plainMessage: string
      formattedMessage?: string
      timestamp: i64
      salt: i64
      previousMessages: previousMessages
      unsignedChatContent?: string
      filterType: varint
      filterTypeMask: filterType ?
         if 2: i64[]varint
         default: void
      type: varint
      networkName: string
      networkTargetName?: string

   packet_respawn:
      dimension: string
      worldName: string
      hashedSeed: i64
      gamemode: i8
      previousGamemode: u8
      isDebug: bool
      isFlat: bool
      copyMetadata: bool
      death?:
         dimensionName: string
         location: position

   packet_system_chat:
      content: string
      isActionBar: bool

   packet_server_data:
      motd?: string
      icon?: string
      previewsChat: bool
      enforcesSecureChat: bool

   packet_message_header:
      previousSignature?: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      senderUuid: UUID
      signature: [
         "buffer",
         {
            "countType": "varint"
         }
      ]
      messageHash: [
         "buffer",
         {
            "countType": "varint"
         }
      ]

   packet:
      name: varint =>
         0x00: spawn_entity
         0x01: spawn_entity_experience_orb
         0x02: named_entity_spawn
         0x03: animation
         0x04: statistics
         0x05: acknowledge_player_digging
         0x06: block_break_animation
         0x07: tile_entity_data
         0x08: block_action
         0x09: block_change
         0x0a: boss_bar
         0x0b: difficulty
         0x0c: chat_preview
         0x0d: clear_titles
         0x0e: tab_complete
         0x0f: declare_commands
         0x10: close_window
         0x11: window_items
         0x12: craft_progress_bar
         0x13: set_slot
         0x14: set_cooldown
         0x15: chat_suggestions
         0x16: custom_payload
         0x17: named_sound_effect
         0x18: hide_message
         0x19: kick_disconnect
         0x1a: entity_status
         0x1b: explosion
         0x1c: unload_chunk
         0x1d: game_state_change
         0x1e: open_horse_window
         0x1f: initialize_world_border
         0x20: keep_alive
         0x21: map_chunk
         0x22: world_event
         0x23: world_particles
         0x24: update_light
         0x25: login
         0x26: map
         0x27: trade_list
         0x28: rel_entity_move
         0x29: entity_move_look
         0x2a: entity_look
         0x2b: vehicle_move
         0x2c: open_book
         0x2d: open_window
         0x2e: open_sign_entity
         0x2f: ping
         0x30: craft_recipe_response
         0x31: abilities
         0x32: message_header
         0x33: player_chat
         0x34: end_combat_event
         0x35: enter_combat_event
         0x36: death_combat_event
         0x37: player_info
         0x38: face_player
         0x39: position
         0x3a: unlock_recipes
         0x3b: entity_destroy
         0x3c: remove_entity_effect
         0x3d: resource_pack_send
         0x3e: respawn
         0x3f: entity_head_rotation
         0x40: multi_block_change
         0x41: select_advancement_tab
         0x42: server_data
         0x43: action_bar
         0x44: world_border_center
         0x45: world_border_lerp_size
         0x46: world_border_size
         0x47: world_border_warning_delay
         0x48: world_border_warning_reach
         0x49: camera
         0x4a: held_item_slot
         0x4b: update_view_position
         0x4c: update_view_distance
         0x4d: spawn_position
         0x4e: should_display_chat_preview
         0x4f: scoreboard_display_objective
         0x50: entity_metadata
         0x51: attach_entity
         0x52: entity_velocity
         0x53: entity_equipment
         0x54: experience
         0x55: update_health
         0x56: scoreboard_objective
         0x57: set_passengers
         0x58: teams
         0x59: scoreboard_score
         0x5a: simulation_distance
         0x5b: set_title_subtitle
         0x5c: update_time
         0x5d: set_title_text
         0x5e: set_title_time
         0x5f: entity_sound_effect
         0x60: sound_effect
         0x61: stop_sound
         0x62: system_chat
         0x63: playerlist_header
         0x64: nbt_query_response
         0x65: collect
         0x66: entity_teleport
         0x67: advancements
         0x68: entity_update_attributes
         0x69: entity_effect
         0x6a: declare_recipes
         0x6b: tags
      params: name ?
         if spawn_entity: packet_spawn_entity
         if spawn_entity_experience_orb: packet_spawn_entity_experience_orb
         if named_entity_spawn: packet_named_entity_spawn
         if animation: packet_animation
