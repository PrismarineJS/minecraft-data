name: Bedrock Version Bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bedrock Minecraft version (e.g., 1.21.124)'
        required: true
        type: string
      protocolVersion:
        description: 'Protocol version number (e.g., 860)'
        required: true
        type: string
      issueUrl:
        description: 'Relevant bedrock-protocol issue URL'
        required: true
        type: string
      createPr:
        description: 'Whether to create a new PR if none exists'
        required: false
        default: 'false'

jobs:
  bump-bedrock-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd tools/js
          npm install

      - name: Run version bump script
        run: |
          cd tools/js
          npm run version bedrock "${VERSION}" "${PROTOCOL_VERSION}"
        env:
          VERSION: ${{ github.event.inputs.version }}
          PROTOCOL_VERSION: ${{ github.event.inputs.protocolVersion }}

      - name: Build protocol files
        run: |
          cd tools/js
          npm run build

      - name: Run tests
        run: |
          cd tools/js
          npm test

      - name: Set branch name
        id: branch
        run: echo "name=bedrock_$(printf '%s' "$VERSION" | tr -c '[:alnum:]' '_' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ github.event.inputs.version }}

      - name: Create Pull Request
        if: ${{ github.event.inputs.createPr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_PASSWORD || secrets.GITHUB_TOKEN }}
          commit-message: 🎈 Add Minecraft bedrock ${{ github.event.inputs.version }} data
          branch: ${{ steps.branch.outputs.name }}
          title: 🎈 Add Minecraft bedrock ${{ github.event.inputs.version }} data
          body: |
            This automated PR sets up the relevant boilerplate for Minecraft bedrock version ${{ github.event.inputs.version }}. Fixes ${{ github.event.inputs.issueUrl }}.

            Related:
            - Issue: ${{ github.event.inputs.issueUrl }}
            - Protocol Version: ${{ github.event.inputs.protocolVersion }}
            <!--minecraft-data-generator-placeholder-->

            * You can help contribute to this PR by opening a PR against this <code branch>${{ steps.branch.outputs.name }}</code> branch instead of <code>master</code>.
