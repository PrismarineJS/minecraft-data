name: Bedrock Version Bump

on:
  workflow_dispatch:
    inputs:
      minecraftVersion:
        description: 'Bedrock Minecraft version (e.g., 1.21.124)'
        required: true
        type: string
      protocolVersion:
        description: 'Protocol version number (e.g., 860)'
        required: true
        type: string
      createPr:
        description: 'Create a pull request with the changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-bedrock-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd tools/js
          npm install

      - name: Run version bump script
        run: |
          cd tools/js
          npm run version bedrock ${{ github.event.inputs.minecraftVersion }} ${{ github.event.inputs.protocolVersion }}

      - name: Build protocol files
        run: |
          cd tools/js
          npm run build

      - name: Run tests
        run: |
          cd tools/js
          npm test

      - name: Create Pull Request
        if: ${{ github.event.inputs.createPr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_PASSWORD || secrets.GITHUB_TOKEN }}
          commit-message: |
            🎈 Add Minecraft bedrock ${{ github.event.inputs.minecraftVersion }} data

            Updates:
            - Protocol version → ${{ github.event.inputs.protocolVersion }}
            - Minecraft version → ${{ github.event.inputs.minecraftVersion }}
            - Moved previous proto.yml to versioned folder
            - Updated protocolVersions.json, versions.json, and dataPaths.json
            - Regenerated protocol.json files
          branch: bedrock-bump-${{ github.event.inputs.minecraftVersion }}
          delete-branch: true
          title: 🎈 Add Minecraft bedrock ${{ github.event.inputs.minecraftVersion }} data
          body: |
            This automated PR sets up the relevant boilerplate for Minecraft bedrock version ${{ github.event.inputs.minecraftVersion }}. Fixes https://github.com/PrismarineJS/bedrock-protocol.

            Related:
            - Issue: https://github.com/PrismarineJS/bedrock-protocol
            - Protocol Version: ${{ github.event.inputs.protocolVersion }}
            <!--minecraft-data-generator-placeholder-->

            * You can help contribute to this PR by opening a PR against this <code branch>bedrock-bump-${{ github.event.inputs.minecraftVersion }}</code> branch instead of <code>master</code>.
          labels: |
            bedrock
            version-bump
            automated
